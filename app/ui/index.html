<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>R64texHD - HD Texture Toolkit - RT64 Support v0.4.20</title>
<style>
:root {
  --bg: #0b1022; --panel: #111833; --panel-2: #0e152d; --field: #18213f; --field-hover: #202b50; --line: #1d2747;
  --text: #f1f3f9; --muted: #8f9abb; --orange: #ff8a1c; --orange-hi: #ffa043; --ink: #1a1206;
  --card: #6a330f; --card-line: #8b4716; --good: #3fcf7a; --bad: #ff6464; --r: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
button, input { font: inherit; color: inherit; }
input { user-select: text; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

header { position: relative; height: 192px; padding: 0 28px; overflow: hidden; display: flex; align-items: center;
  background: linear-gradient(90deg, #0b1022 0%, #140c30 38%, #2a1252 70%, #3b1868 100%); }
header::after { content: ""; position: absolute; inset: auto 0 0 0; height: 34px; background: linear-gradient(transparent, var(--bg)); z-index: 1; pointer-events: none; }
/* Header artwork: the R64 scene sits on the right and fades into the dark background on the left. */
.hdr-art { position: absolute; top: 0; height: 100%; width: auto; z-index: 0; pointer-events: none;
  right: clamp(-135px, calc(100vw - 1340px), 0px);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, rgba(0,0,0,.55) 9%, #000 22%);
          mask-image: linear-gradient(90deg, transparent 0, rgba(0,0,0,.55) 9%, #000 22%); }
.hdr-text { position: relative; z-index: 2; }
h1 { margin: 0; white-space: nowrap; font-size: 27px; font-weight: 800; letter-spacing: .3px; text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(11,16,34,.9); }
.sub span { white-space: nowrap; }
.sub { margin-top: 12px; color: var(--orange); font-size: 13.5px; font-weight: 600; letter-spacing: .1px; max-width: 520px; line-height: 1.5; text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 0 14px rgba(11,16,34,.95); }

main { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 22px; padding: 0 18px; min-height: 0; position: relative; z-index: 1; }
nav { background: var(--panel); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
nav button { all: unset; cursor: pointer; padding: 12px 14px; border-radius: 8px; font-weight: 600; display: flex; gap: 12px; align-items: center; }
nav button .n { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; background: var(--field); color: var(--muted); flex: none; }
nav button:hover { background: var(--field); }
nav button.active { background: var(--orange); color: var(--ink); box-shadow: 0 2px 10px rgba(255,138,28,.25); }
nav button.active .n { background: rgba(26,18,6,.18); color: var(--ink); }
nav button:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
nav .spacer { flex: 1; }
nav.locked button { pointer-events: none; opacity: .45; }

.page { background: var(--panel); border-radius: var(--r); padding: 22px 26px 18px; overflow: auto; min-height: 0; }
.page h2 { margin: 0; font-size: 19px; font-weight: 700; }
.lead { margin: 12px 0 22px; color: var(--muted); }

.card { display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: var(--r); background: var(--card); border: 1px solid var(--card-line); margin-bottom: 24px; min-height: 76px; }
.card .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--orange); flex: none; box-shadow: 0 0 0 4px rgba(255,138,28,.12); }
.card.idle { background: #1a2140; border-color: #253058; } .card.idle .dot { background: #56628a; box-shadow: none; }
.card.error { background: #4a1820; border-color: #6d2430; } .card.error .dot { background: var(--bad); }
.card.done .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(63,207,122,.15); }
.card .body { flex: 1; min-width: 0; }
.card .t { font-weight: 700; }
.card .p { margin-top: 6px; color: #f3e6da; word-break: break-all; font-size: 13.5px; white-space: pre-line; }
.card .bar { margin-top: 10px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; }
.card .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--orange-hi)); transition: width .25s; }
.card .act { flex: none; display: flex; gap: 8px; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: center; padding: 10px 0 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row .l b { display: block; font-weight: 600; }
.row .l small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.row[hidden] { display: none; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-width: 0; padding: 7px 8px; border: 0; border-radius: 7px; background: var(--field); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button:hover { background: var(--field-hover); }
.seg button.on { background: var(--orange); color: var(--ink); font-weight: 600; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.path { display: flex; gap: 8px; }
.path input { flex: 1; min-width: 0; padding: 7px 12px; border: 1px solid transparent; border-radius: 7px; background: var(--field); }
.path input:focus { border-color: #3a4776; outline: none; }
.btn { padding: 7px 16px; border: 0; border-radius: 7px; background: var(--field); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--field-hover); }
.btn.primary { background: var(--orange); color: var(--ink); font-weight: 600; }
.btn.primary:hover { background: var(--orange-hi); }
.btn:disabled { opacity: .5; cursor: default; }
.seg button:focus-visible, .btn:focus-visible, .path input:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
.tool { margin-top: 6px; color: var(--muted); font-size: 12.5px; word-break: break-all; }
.tool.ok { color: var(--good); }
.card.notice { background: linear-gradient(90deg, rgba(255,138,28,.16), rgba(255,138,28,.05)); border-color: rgba(255,138,28,.45); }
.card.notice .p { color: #f3e6da; word-break: normal; }
.card.notice ul { margin: 8px 0 0; padding-left: 18px; color: #f3e6da; font-size: 13.5px; }
nav button .badge { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-left: auto; box-shadow: 0 0 0 3px rgba(255,138,28,.18); }
nav button.active .badge { background: var(--ink); box-shadow: none; }
.log { margin-top: 18px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font: 12px/1.5 "Cascadia Mono", Consolas, monospace; color: #c2c9df; max-height: 150px; overflow: auto; white-space: pre-wrap; user-select: text; }
.log:empty { display: none; }

footer { display: flex; align-items: flex-end; gap: 14px; padding: 14px 18px 16px; }
.hints { flex: 1; color: var(--muted); font-size: 12px; }
.hints div:first-child span { margin-right: 22px; }
.hints div + div { margin-top: 8px; }
.foot-btn { width: 130px; height: 50px; border: 0; border-radius: 12px; background: var(--field); font-size: 14.5px; cursor: pointer; }
.foot-btn:hover { background: var(--field-hover); }
.go { width: 214px; height: 58px; border: 0; border-radius: 30px; cursor: pointer; font-size: 17px; font-weight: 800; letter-spacing: .6px; color: var(--ink);
  background: linear-gradient(180deg, var(--orange-hi), var(--orange)); box-shadow: 0 0 0 3px #2a1606, 0 0 0 5px rgba(255,138,28,.55), 0 6px 22px rgba(255,138,28,.25); }
.go:hover { filter: brightness(1.06); }
.go:active { transform: translateY(1px); }
.go.cancel { background: linear-gradient(180deg, #3a456f, #2b3459); color: var(--text); box-shadow: 0 0 0 3px #101528, 0 0 0 5px #3a456f; }

.modal { position: fixed; inset: 0; background: rgba(5,8,18,.72); display: grid; place-items: center; z-index: 10; }
.modal[hidden] { display: none; }
.dialog { width: min(520px, calc(100vw - 32px)); background: var(--panel); border: 1px solid #263158; border-radius: 16px; padding: 24px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.dialog h3 { margin: 0 0 10px; font-size: 18px; }
.dialog p { margin: 0 0 22px; color: var(--muted); }
.dialog .buttons { display: flex; gap: 10px; justify-content: flex-end; }
.dialog .buttons .btn { padding: 10px 18px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3460; border-radius: 6px; border: 2px solid var(--panel); }
::-webkit-scrollbar-thumb:hover { background: #3a4778; }
.preview { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 12px 16px 14px; margin-bottom: 22px;
  position: sticky; top: -22px; z-index: 3; box-shadow: 0 10px 24px rgba(5,8,18,.55); }
.pv-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.pv-head > b { font-weight: 700; flex: none; }
.pv-pick { display: flex; gap: 6px; flex: 1; min-width: 0; }
.pv-pick select { flex: 1; min-width: 0; background: var(--field); color: var(--text); border: 0; border-radius: 7px; padding: 7px 10px; font: inherit; }
.pv-pick select:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
.pv-step { padding: 7px 11px; }
.pv-zoom { width: 190px; flex: none; }
.pv-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pv-cap { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-cap b { color: var(--text); font-weight: 600; }
.pv-view { position: relative; height: clamp(180px, calc(100vh - 620px), 360px); border-radius: 10px; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line);
  background-color: #161d38; background-image: conic-gradient(#1f2849 25%, transparent 0 50%, #1f2849 0 75%, transparent 0); background-size: 16px 16px; }
.pv-view.z1 { display: block; overflow: auto; }
.pv-view.z1 canvas { display: block; margin: 0 auto; }
.pv-view canvas.px { image-rendering: pixelated; }
.pv-busy { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; background: rgba(11,16,34,.88); border: 1px solid #2a3460;
  padding: 6px 12px; border-radius: 8px; font-size: 12px; }
.pv-busy[hidden] { display: none; }
.pv-busy i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--orange); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pv-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
.pv-msg.err { color: var(--bad); }
.pv-empty { height: 90px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #222c52; border: 1px solid #34417a; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
.about p { color: var(--muted); }
.repo { display: flex; align-items: center; gap: 16px; margin-top: 26px; padding: 16px 20px; border-radius: var(--r); background: var(--card-2, #151c38); border: 1px solid #253058; }
.repo svg { width: 30px; height: 30px; flex: none; fill: var(--text); }
.repo .rt { flex: 1; min-width: 0; } .repo .rt b { display: block; } .repo .rt span { color: var(--muted); font-size: 13px; word-break: break-all; }
@media (max-width: 1240px) { h1 { font-size: 21px; } .sub { font-size: 12.5px; max-width: 400px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hdr-text">
      <h1>R64texHD - Reimagine Every Pixel</h1>
      <div class="sub"><span>Upscale .dds / .png textures -</span> <span>Convert RT64 Texture Dump -</span> <span>Pack/Extract .rtz texture packs</span></div>
    </div>
    <img class="hdr-art" src="header-art.jpg" alt="" aria-hidden="true">
  </header>
  <main>
    <nav id="nav">
      <button data-page="upscale"><span class="n">1</span>Upscale Textures</button>
      <button data-page="convert"><span class="n">2</span>Convert RT64 Dump</button>
      <button data-page="pack"><span class="n">3</span>Pack / Unpack .rtz</button>
      <div class="spacer"></div>
      <button data-page="settings">Settings<span class="badge" id="tools-badge" hidden title="Optional tools not downloaded"></span></button>
      <button data-page="about">About</button>
    </nav>
    <section class="page" id="page"></section>
  </main>
  <footer>
    <div class="hints">
      <div><span>Enter&nbsp; Run</span><span>Esc&nbsp; Quit</span><span>Ctrl+S&nbsp; Save</span></div>
      <div id="hint2">Run starts the process on this page. Save keeps these settings.</div>
    </div>
    <button class="foot-btn" id="quit">Quit</button>
    <button class="foot-btn" id="save">Save</button>
    <button class="go" id="go">UPSCALE ▶</button>
  </footer>
</div>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const sep = () => (S.platform === 'win32' ? '\\' : '/');
const join = (dir, name) => (dir ? dir.replace(/[\\/]+$/, '') + sep() + name : '');
const baseName = (p) => (p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop();
let S = null, cfg = null, page = 'upscale', job = { running: false, task: '', log: [], result: null, error: null, done: 0, total: 0, message: '' };
let statusCache = {}, packAfter = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

// ---------------------------------------------------------------- controls
const seg = (key, options, value, disabled = []) => `<div class="seg" data-key="${key}">` + options.map(([v, label]) =>
  `<button data-v="${esc(v)}" class="${String(value) === String(v) ? 'on' : ''}" ${disabled.includes(v) ? 'disabled' : ''}>${label}</button>`).join('') + '</div>';
const row = (title, desc, control, show = true) => `<div class="row" ${show ? '' : 'hidden'}><div class="l"><b>${title}</b><small>${desc}</small></div><div>${control}</div></div>`;
const pathField = (key, value, buttons, placeholder = '') => `<div class="path"><input data-path="${key}" value="${esc(Array.isArray(value) ? value.join(' ; ') : value)}" placeholder="${esc(placeholder)}" spellcheck="false">` +
  buttons.map(([kind, label]) => `<button class="btn" data-browse="${kind}" data-for="${key}">${label}</button>`).join('') + '</div>';
const card = () => `<div class="card idle" id="status"><div class="dot"></div><div class="body"><div class="t"></div><div class="p"></div><div class="bar" hidden><i></i></div></div><div class="act"></div></div>`;
const DDS_OPTS = () => [['auto', 'Auto'], ['bc7', 'BC7'], ['bc3', 'BC3'], ['bc1', 'BC1'], ['rgba8', 'None']];

function getVal(key) { return key.split('.').reduce((o, k) => (o == null ? o : o[k]), cfg); }
function setVal(key, v) {
  const parts = key.split('.'); let o = cfg;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  const last = parts[parts.length - 1], old = o[last];
  if (v === 'true' || v === 'false') v = v === 'true';
  else if (typeof old === 'number' && v !== '' && !isNaN(Number(v))) v = Number(v);
  else if (key === 'upscale.size' && v !== 'fit') v = Number(v);
  o[last] = v;
}

// ---------------------------------------------------------------- pages
const pages = {
  setup() {
    return `<h2>Welcome</h2><p class="lead">Two folders to set up first. You can change them later in Settings.</p>
      ${row('RT64 texture dump folder', 'Where RT64 saves texture dumps (RT64 debugger, F1 > Textures > Start dumping textures). Skip it if you do not use RT64 dumps.',
        pathField('dumpFolder', cfg.dumpFolder, [['folder', 'Browse…']], 'Optional'))}
      ${row('Output folder', 'Where upscaled textures, converted dumps and .rtz packs are saved by default.',
        pathField('outputFolder', cfg.outputFolder, [['folder', 'Browse…']], 'Choose a folder'))}
      ${S.platform === 'win32' ? row('Desktop shortcut', 'Optional. The toolkit is portable: nothing is installed or written to AppData.', `<button class="btn" id="mk-shortcuts" style="width:100%">Create Desktop shortcut</button>`) : ''}
      ${row('Settings location', 'Settings, downloads and temporary files stay in this folder, next to the program.', `<div class="tool">${esc(S.dataDir)}</div>`)}`;
  },
  upscale() {
    const u = cfg.upscale, dds = u.format === 'dds' || u.format === 'same';
    const sharpOk = u.method === 'standard' || u.method === 'ai';
    return `<h2>Upscale Textures</h2><p class="lead">Raise the resolution of PNG and DDS textures: a whole folder (subfolders kept) or picked files.</p>
      ${card()}
      ${previewPanel()}
      ${row('Input', 'A folder of textures, or one or more PNG / DDS files.', pathField('upscale.inputs', u.inputs, [['folder', 'Folder…'], ['images', 'Files…']], 'Choose a folder or files'))}
      ${row('Include subfolders', 'Upscale every texture below the folder, keeping the same folder layout.', seg('upscale.subfolders', [['true', 'Yes'], ['false', 'No']], String(u.subfolders)))}
      ${row('Method', 'Standard enlarges 2× at a time and sharpens after each step. Smooth is one soft resize. Pixel art keeps hard pixels. AI uses Real-ESRGAN (Settings).',
        seg('upscale.method', [['standard', 'Standard'], ['smooth', 'Smooth'], ['pixel', 'Pixel art'], ['ai', 'AI']], u.method, S.tools.realesrgan ? [] : ['ai']))}
      ${row('Size', `How much bigger. Fit scales the longest side to a set size. Nothing grows past ${cfg.maxSize} px.`,
        seg('upscale.size', [['2', '2×'], ['3', '3×'], ['4', '4×'], ['6', '6×'], ['8', '8×'], ['fit', 'Fit']], u.size))}
      ${row('Longest side', 'Target size when Size is Fit.', seg('upscale.fit', [['512', '512'], ['1024', '1024'], ['2048', '2048'], ['4096', '4096']], u.fit), u.size === 'fit')}
      ${row('Sharpness', 'How much detail is brought back after each step; it grows as the texture gets bigger.',
        seg('upscale.sharpness', [['off', 'Off'], ['soft', 'Soft'], ['normal', 'Normal'], ['strong', 'Strong'], ['extra', 'Extra']], u.sharpness), sharpOk)}
      ${row('Edges', 'Tile for textures that repeat (floors, walls) so seams stay invisible. Mirror for mirrored tiling.',
        seg('upscale.edges', [['clamp', 'Normal'], ['wrap', 'Tile'], ['mirror', 'Mirror']], u.edges), u.method !== 'pixel')}
      ${row('Cut-out edges', 'Hard keeps on/off transparency (leaves, fences, text) crisp.', seg('upscale.hardAlpha', [['true', 'Hard'], ['false', 'Smooth']], String(u.hardAlpha)), u.method !== 'pixel')}
      ${row('Output format', 'Same keeps each file’s format.', seg('upscale.format', [['same', 'Same as input'], ['png', 'PNG'], ['dds', 'DDS']], u.format))}
      ${row('DDS compression', 'For DDS output. Auto: BC1 opaque / BC3 transparent. BC7 is sharpest (needs texconv). None is uncompressed.',
        seg('upscale.ddsFormat', DDS_OPTS(), u.ddsFormat, S.tools.texconv ? [] : ['bc7']), dds)}
      ${row('Output folder', 'Where the upscaled textures go.', pathField('upscale.output', u.output, [['folder', 'Browse…']]))}
      ${row('Existing files', 'Skip lets you continue an interrupted run.', seg('upscale.existing', [['overwrite', 'Overwrite'], ['skip', 'Skip']], u.existing))}
      ${row('Other files', 'Copy files that are not textures (rt64.json, readme…) into the output too.', seg('upscale.copyOther', [['true', 'Copy'], ['false', 'Leave']], String(u.copyOther)))}
      <div class="log" id="log"></div>`;
  },
  convert() {
    const c = cfg.convert;
    return `<h2>Convert RT64 Dump</h2><p class="lead">Turn an RT64 texture dump into PNG or DDS textures with a ready-made rt64.json. When it finishes you can pack it into an .rtz.</p>
      ${card()}
      ${row('Dump folder', 'The folder RT64 dumped into: it holds .tmem and .tile.json files.', pathField('convert.input', c.input || cfg.dumpFolder, [['folder', 'Browse…']], 'Choose the RT64 texture dump folder'))}
      ${row('Output format', 'PNG is lossless and easy to edit. DDS loads fastest in game.', seg('convert.format', [['png', 'PNG'], ['dds', 'DDS']], c.format))}
      ${row('DDS compression', 'Auto: BC1 opaque / BC3 transparent. BC7 needs texconv. None is uncompressed.', seg('convert.ddsFormat', DDS_OPTS(), c.ddsFormat, S.tools.texconv ? [] : ['bc7']), c.format === 'dds')}
      ${row('Output folder', 'Gets a textures folder and rt64.json.', pathField('convert.output', c.output, [['folder', 'Browse…']]))}
      <div class="log" id="log"></div>`;
  },
  pack() {
    const p = cfg.pack, u = cfg.unpack, unpacking = p.mode === 'unpack';
    const rows = unpacking
      ? row('Texture pack', 'The .rtz file to open.', pathField('unpack.input', u.input, [['open-rtz', 'Browse…']], 'Choose an .rtz pack'))
        + row('Output folder', 'Choose the folder the pack is unpacked into.', pathField('unpack.output', u.output, [['folder', 'Browse…']]))
        + row('Low-mip cache', 'Leave it out if you plan to edit the textures (it would be out of date); packing rebuilds it.', seg('unpack.keepCache', [['false', 'Leave out'], ['true', 'Keep']], String(u.keepCache)))
      : row('Texture folder', 'The pack folder. Uses its rt64.json, or makes one from hash-named PNG / DDS files.', pathField('pack.input', p.input, [['folder', 'Browse…']], 'Choose the folder to pack'))
        + row('Save .rtz as', 'Choose where the pack file goes.', pathField('pack.output', p.output, [['save-rtz', 'Browse…']]))
        + row('Compression', 'Zstandard matches RT64’s own packer. Deflate opens in any zip tool.', seg('pack.compression', [['zstd', 'Zstandard'], ['deflate', 'Deflate'], ['store', 'Store']], p.compression))
        + row('Compression level', 'Max is the smallest file and the slowest.', seg('pack.level', [['fast', 'Fast'], ['balanced', 'Balanced'], ['max', 'Max']], p.level), p.compression !== 'store')
        + row('Low-mip cache', 'Small previews of DDS textures shown while the full ones stream in. Recommended.', seg('pack.lowMipCache', [['true', 'Build'], ['false', 'Skip']], String(p.lowMipCache)));

// Optional tools: checked at startup, offered on the Settings page.
const TOOL_INFO = {
  texconv: { label: 'texconv', size: '1 MB', use: 'BC7 compression for DDS output' },
  realesrgan: { label: 'Real-ESRGAN', size: '45 MB', use: 'the AI upscale method' },
};
const missingTools = () => Object.keys(TOOL_INFO).filter((n) => !S.tools[n]);
let toolNotice = false, afterTools = 'upscale';
// Startup check: open Settings when a tool is missing (unless turned off).
function toolsLanding(next) {
  afterTools = next;
  if (cfg.checkTools !== false && missingTools().length) { toolNotice = true; return 'settings'; }
  return next;
}
async function installAll() {
  const btn = $('#dl-all'), skip = $('#skip-tools');
  if (btn) { btn.disabled = true; btn.textContent = 'Downloading…'; }
  if (skip) skip.disabled = true;
  for (const name of missingTools()) {
    const status = $('#tool-all');
    if (status) status.textContent = `Downloading ${TOOL_INFO[name].label}…`;
    const r = await window.htk.installTool(name);
    if (!r.ok) {
      render();
      const el = $('#tool-all'); if (el) el.textContent = `${TOOL_INFO[name].label} download failed: ${r.error}`;
      return;
    }
    S.tools = r.tools;
  }
  toast('Tools installed'); render();
}

// The Pack / Unpack page runs either task, chosen by its Mode switch.
const taskOf = (pg) => (pg === 'pack' && cfg.pack.mode === 'unpack' ? 'unpack' : pg);
const pageOf = (task) => (task === 'unpack' ? 'pack' : task);
const RUN_LABEL = { upscale: 'UPSCALE ▶', convert: 'CONVERT ▶', pack: 'PACK ▶', unpack: 'UNPACK ▶', setup: 'CONTINUE ▶' };

// ---------------------------------------------------------------- render
function suggest() {
  const out = cfg.outputFolder;
  if (!out) return;
  const u = cfg.upscale, c = cfg.convert, p = cfg.pack;
  const firstIn = Array.isArray(u.inputs) ? u.inputs[0] : u.inputs;
  if (!u.output && firstIn) u.output = join(out, baseName(u.inputs.length > 1 ? firstIn.replace(/[\\/][^\\/]*$/, '') : firstIn).replace(/\.(png|dds)$/i, '') + '-upscaled');
  if (!c.output) c.output = join(out, (baseName(c.input || cfg.dumpFolder) || 'rt64-dump') + '-textures');
  if (!p.output && p.input) p.output = join(out, baseName(p.input) + '.rtz');
  if (!cfg.unpack.output && cfg.unpack.input) cfg.unpack.output = join(out, baseName(cfg.unpack.input).replace(/\.rtz$/i, '') + '-unpacked');
}

function render() {
  const setup = page === 'setup';
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.page === page));
  $('#nav').classList.toggle('locked', setup);
  $('#tools-badge').hidden = !missingTools().length;
  suggest();
  savePreviewScroll();
  $('#page').innerHTML = pages[page]();
  const go = $('#go');
  go.style.visibility = (page === 'settings' || page === 'about') ? 'hidden' : 'visible';
  $('#hint2').textContent = setup ? 'Continue saves these folders and opens the toolkit.' : 'Run starts the process on this page. Save keeps these settings.';
  renderJob();
  refreshStatus();
  if (page === 'upscale') afterRenderPreview();
}

function inputFor() {
  if (page === 'upscale') return ['upscale', cfg.upscale.inputs];
  if (page === 'convert') return ['convert', cfg.convert.input || cfg.dumpFolder];
  if (page === 'pack') return cfg.pack.mode === 'unpack' ? ['unpack', cfg.unpack.input] : ['pack', cfg.pack.input];
  return [null, null];
}

async function refreshStatus() {
  if (!$('#status')) return;
  if (job.task === taskOf(page) && (job.running || job.result || job.error)) return renderJob();
  const [kind, value] = inputFor();
  const key = kind + '|' + JSON.stringify(value);
  if (!value || (Array.isArray(value) && !value.length)) return setCard('idle', { upscale: 'Choose a folder or files to upscale', convert: 'Choose your RT64 texture dump folder', pack: 'Choose the texture folder to pack', unpack: 'Choose the .rtz pack to unpack' }[taskOf(page)], 'Use Browse… or paste a path.');
  if (!statusCache[key]) { setCard('idle', 'Checking…', ''); statusCache[key] = await window.htk.inspect(kind, value); }
  if (inputFor()[0] !== kind) return;
  const s = statusCache[key];
  setCard(s.state, s.title, s.text);
}

function setCard(state, title, text, progress, actions) {
  const c = $('#status'); if (!c) return;
  c.className = 'card ' + ({ ready: '', idle: 'idle', error: 'error', done: 'done', running: '' }[state] ?? '');
  $('.t', c).textContent = title || '';
  $('.p', c).textContent = text || '';
  const bar = $('.bar', c);
  bar.hidden = progress === undefined;
  if (progress !== undefined) $('i', bar).style.width = Math.round(progress * 100) + '%';
  $('.act', c).innerHTML = actions || '';
}

function renderJob() {
  const go = $('#go');
  if (page === 'setup') { go.textContent = RUN_LABEL.setup; go.classList.remove('cancel'); return; }
  if (job.running) { go.textContent = 'CANCEL ■'; go.classList.add('cancel'); }
  else { go.textContent = RUN_LABEL[taskOf(page)] || 'RUN ▶'; go.classList.remove('cancel'); }
  if (job.task !== taskOf(page)) return;
  const log = $('#log');
  if (log) { const t = job.log.join('\n'); if (log.textContent !== t) { log.textContent = t; log.scrollTop = log.scrollHeight; } }
  if (!$('#status')) return;
  if (job.running) {
    const count = job.total ? `${job.done.toLocaleString()} / ${job.total.toLocaleString()}` : '';
    setCard('running', `${{ upscale: 'Upscaling', convert: 'Converting', pack: 'Packing', unpack: 'Unpacking' }[job.task]}… ${count}`, job.message || 'Starting…', job.total ? job.done / job.total : 0);
  } else if (job.result) {
    const r = job.result;
    const what = r.title === 'Packed' ? `${r.written.toLocaleString()} textures, ${r.sizeMB.toFixed(1)} MB` : `${r.written.toLocaleString()} texture${r.written === 1 ? '' : 's'}`;
    let actions = `<button class="btn" data-open="${esc(r.output)}">Open</button>`;
    if (r.packable && job.task === 'convert') actions += `<button class="btn primary" id="pack-now">Pack into .rtz…</button>`;
    if (r.packable && job.task === 'upscale') actions += `<button class="btn primary" id="go-pack">Go to Pack / Unpack</button>`;
    setCard('done', `${r.title} ${what}${r.failed ? ` (${r.failed} failed, see below)` : ''} in ${r.seconds.toFixed(1)} s`, r.output, undefined, actions);
  } else if (job.error) {
    setCard('error', job.error === 'Cancelled' ? 'Cancelled' : 'Could not finish', job.error === 'Cancelled' ? 'Stopped. Files already finished were kept; nothing was left half-written.' : job.error);
  }
}

// ---------------------------------------------------------------- dialogs
function modal(html) { $('#dialog').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }

function askPack(result) {
  packAfter = result.output;
  modal(`<h3>Pack into an .rtz file?</h3><p>${result.written.toLocaleString()} textures and rt64.json are in<br><b>${esc(result.output)}</b>.<br><br>Pack them into a single .rtz file the game can load directly?</p>
    <div class="buttons"><button class="btn" id="m-no">Not now</button><button class="btn primary" id="m-yes">Pack into .rtz…</button></div>`);
  $('#m-yes').focus();
}

// After an upscale: offer to continue in 3 · Pack to .rtz with the upscaled folder filled in.
function askGoPack(result) {
  packAfter = result.output;
  modal(`<h3>Pack the upscaled textures?</h3><p>${result.written.toLocaleString()} upscaled texture${result.written === 1 ? ' is' : 's are'} in<br><b>${esc(result.output)}</b>.<br><br>Go to <b>3 · Pack / Unpack .rtz</b> to pack them into an .rtz file?</p>
    <div class="buttons"><button class="btn" id="m-no">Not now</button><button class="btn primary" id="m-go-pack">Go to Pack / Unpack</button></div>`);
  $('#m-go-pack').focus();
}

function goToPack(folder) {
  closeModal();
  cfg.pack.mode = 'pack';
  cfg.pack.input = folder;
  cfg.pack.output = join(cfg.outputFolder || folder.replace(/[\\/][^\\/]*$/, ''), baseName(folder) + '.rtz');
  page = 'pack'; cfg.page = page; statusCache = {};
  job = { running: false, task: '', log: [], result: null, error: null, done: 0, total: 0, message: '' };
  render();
  toast('Ready to pack: check the options, then press PACK');
}

async function packConverted(folder) {
  closeModal();
  const out = await window.htk.dialog({ kind: 'save-rtz', title: 'Save the .rtz pack as', defaultPath: join(cfg.outputFolder || folder.replace(/[\\/][^\\/]*$/, ''), baseName(folder) + '.rtz') });
  if (!out) return;
  cfg.pack.mode = 'pack'; cfg.pack.input = folder; cfg.pack.output = out;
  page = 'pack'; cfg.page = page; statusCache = {};
  render();
  start('pack');
}

// ---------------------------------------------------------------- events
document.addEventListener('click', async (e) => {
  const nav = e.target.closest('nav button');
  if (nav) { page = nav.dataset.page; cfg.page = page; render(); return; }
  const pz = e.target.closest('[data-pvzoom]');
  if (pz) {
    savePreviewScroll();
    PV.zoom = pz.dataset.pvzoom;
    document.querySelectorAll('[data-pvzoom]').forEach((b) => b.classList.toggle('on', b === pz));
    if (PV.zoom !== 'fit' && PV.shown) {          // start zoomed views centred on the texture
      const v = $('#pv-view-u'), k = PV.zoom === '2' ? 2 : 1;
      PV.scroll = { x: Math.max(0, (PV.shown.up.width * k - v.clientWidth) / 2), y: Math.max(0, (PV.shown.up.height * k - v.clientHeight) / 2) };
    }
    drawPreview(); return;
  }
  const ps = e.target.closest('[data-pvstep]');
  if (ps && PV.list.length) {
    const i = PV.list.findIndex((x) => x.src === PV.src);
    const n = (i + Number(ps.dataset.pvstep) + PV.list.length) % PV.list.length;
    PV.src = PV.list[n].src; PV.scroll = { x: 0, y: 0 };
    fillPreviewPicker(); drawPreview(); schedulePreview(); return;
  }
  const sb = e.target.closest('.seg button');
  if (sb && !sb.disabled) { setVal(sb.parentElement.dataset.key, sb.dataset.v); clearFinished(); render(); return; }
  const br = e.target.closest('[data-browse]');
  if (br) {
    const key = br.dataset.for, kind = br.dataset.browse;
    const titles = { folder: 'Choose a folder', images: 'Choose textures', 'save-rtz': 'Save the .rtz pack as', 'open-rtz': 'Choose an .rtz pack', exe: 'Locate the program' };
    let current = getVal(key); if (Array.isArray(current)) current = current[0];
    const r = await window.htk.dialog({ kind, title: titles[kind], defaultPath: current || undefined });
    if (r) {
      if (key === 'upscale.inputs') cfg.upscale.inputs = Array.isArray(r) ? r : [r];
      else setVal(key, r);
      onPath(key);
      if (key === 'texconv' || key === 'realesrgan') { await window.htk.saveSettings(cfg); S = await window.htk.state(); }
      render();
    }
    return;
  }
  const open = e.target.closest('[data-open]');
  if (open) { window.htk.open(open.dataset.open); return; }
  if (e.target.id === 'pack-now') { packConverted(job.result.output); return; }
  if (e.target.id === 'go-pack') { goToPack(job.result.output); return; }
  if (e.target.id === 'm-go-pack') { goToPack(packAfter); return; }
  if (e.target.id === 'm-yes') { packConverted(packAfter); return; }
  if (e.target.id === 'm-no') { closeModal(); return; }
  if (e.target.id === 'mk-shortcuts') { const r = await window.htk.createShortcuts(); toast(r.ok ? 'Desktop shortcut created' : (r.error || 'Could not create the shortcut')); return; }
  if (e.target.id === 'open-repo') { window.htk.openRepo(); return; }
  if (e.target.id === 'dl-all') { installAll(); return; }
  if (e.target.id === 'skip-tools') { toolNotice = false; page = afterTools; cfg.page = page; render(); return; }
  const inst = e.target.closest('[data-install]');
  if (inst) {
    inst.disabled = true; inst.textContent = 'Downloading…';
    const r = await window.htk.installTool(inst.dataset.install);
    if (r.ok) { S.tools = r.tools; toast('Installed'); render(); }
    else { inst.disabled = false; inst.textContent = 'Retry download'; $('#tool-' + inst.dataset.install).textContent = 'Download failed: ' + r.error; }
  }
});

function onPath(key) {
  const out = cfg.outputFolder;
  if (key === 'upscale.inputs' && out) {
    const first = cfg.upscale.inputs[0] || '';
    const name = cfg.upscale.inputs.length > 1 ? baseName(first.replace(/[\\/][^\\/]*$/, '')) : baseName(first).replace(/\.(png|dds)$/i, '');
    cfg.upscale.output = join(out, name + '-upscaled');
  }
  if (key === 'convert.input' && out) cfg.convert.output = join(out, baseName(cfg.convert.input) + '-textures');
  if (key === 'pack.input' && out) cfg.pack.output = join(out, baseName(cfg.pack.input) + '.rtz');
  if (key === 'unpack.input' && out) cfg.unpack.output = join(out, baseName(cfg.unpack.input).replace(/\.rtz$/i, '') + '-unpacked');
  if (key === 'pack.output' && cfg.pack.output && !/\.rtz$/i.test(cfg.pack.output)) cfg.pack.output += '.rtz';
  clearFinished();
}

function clearFinished() { if (!job.running) { job.result = null; job.error = null; job.task = ''; } }

document.addEventListener('change', (e) => {
  const inp = e.target.closest('[data-path]');
  if (!inp) return;
  const key = inp.dataset.path, v = inp.value.trim();
  if (key === 'upscale.inputs') cfg.upscale.inputs = v ? v.split(/\s*;\s*/).filter(Boolean) : [];
  else setVal(key, v);
  onPath(key); render();
});

async function save(quiet) { await window.htk.saveSettings(cfg); if (!quiet) toast('Settings saved'); }

function params(task) {
  if (task === 'upscale') return { ...cfg.upscale };
  if (task === 'convert') return { ...cfg.convert, input: cfg.convert.input || cfg.dumpFolder };
  if (task === 'unpack') return { ...cfg.unpack };
  return { ...cfg.pack };
}

async function start(task) {
  await save(true);
  job = { running: false, task, log: [], result: null, error: null, done: 0, total: 0, message: '' };
  const r = await window.htk.run(task, params(task));
  if (!r.ok) { toast(r.error); return; }
  job.running = true; render();
}

async function go() {
  if (page === 'setup') {
    if (!cfg.outputFolder) { toast('Choose an output folder first'); return; }
    cfg.firstRunDone = true; await save(true); page = toolsLanding('upscale'); cfg.page = 'upscale'; render(); return;
  }
  if (job.running) { await window.htk.cancel(); toast('Cancelling…'); return; }
  if (pages[page] && RUN_LABEL[page]) start(taskOf(page));
}

window.htk.onStarted(() => {});
window.htk.onLog((t) => { job.log.push(t); if (job.task === taskOf(page)) renderJob(); });
window.htk.onProgress((p) => { job.done = p.done; job.total = p.total; if (p.message) job.message = p.message; if (job.task === taskOf(page)) renderJob(); });
window.htk.onDone((d) => {
  job.running = false;
  if (d.error) { job.error = d.error; job.log.push(d.error === 'Cancelled' ? 'Cancelled.' : 'Error: ' + d.error); }
  else {
    job.result = d.result;
    const r = d.result;
    job.log.push(`${r.title} ${r.written} texture(s)${r.failed ? `, ${r.failed} failed` : ''} in ${r.seconds.toFixed(1)} s → ${r.output}`);
  }
  statusCache = {};
  if (job.task !== taskOf(page)) {
    page = pageOf(job.task); cfg.page = page;
    if (page === 'pack') cfg.pack.mode = job.task;
  }
  render();
  if (d.task === 'convert' && d.result && d.result.packable) askPack(d.result);
  if (d.task === 'upscale' && d.result && d.result.packable) askGoPack(d.result);
});
window.htk.onToolProgress((p) => {
  const amount = p.total ? `${Math.round(p.got * 100 / p.total)}%` : `${(p.got / 1048576).toFixed(1)} MB`;
  const el = $('#tool-' + p.name); if (el) el.textContent = `Downloading… ${amount}`;
  const all = $('#tool-all'); if (all) all.textContent = `Downloading ${TOOL_INFO[p.name] ? TOOL_INFO[p.name].label : p.name}… ${amount}`;
});

$('#go').addEventListener('click', go);
$('#save').addEventListener('click', () => save(false));
$('#quit').addEventListener('click', async () => { if (job.running && !confirm('A process is running. Cancel it and quit?')) return; await save(true); window.htk.quit(); });
document.addEventListener('keydown', (e) => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(false); }
  else if (e.key === 'Escape') $('#quit').click();
  else if (e.key === 'Enter' && !e.target.closest('input, button')) { e.preventDefault(); go(); }
});


// ---------------------------------------------------------------- live preview (1 · Upscale)
const PV = { list: [], total: 0, listKey: '', src: '', zoom: 'fit', cache: new Map(), shown: null, shownKey: '', pendingKey: '',
  error: '', timer: null, scroll: { x: 0, y: 0 }, loadingList: false };

function previewParams() {
  const u = cfg.upscale;
  return { src: PV.src, method: u.method, size: u.size, fit: u.fit, sharpness: u.sharpness, edges: u.edges, hardAlpha: u.hardAlpha,
    format: u.format, ddsFormat: u.ddsFormat, maxSize: cfg.maxSize, model: cfg.realesrganModel };
}
const previewKey = () => JSON.stringify(previewParams());

function previewPanel() {
  const head = `<div class="pv-head"><b>Preview</b>
      <div class="pv-pick"><button class="btn pv-step" data-pvstep="-1" title="Previous texture">◀</button>
        <select id="pv-file" title="Texture to preview"></select>
        <button class="btn pv-step" data-pvstep="1" title="Next texture">▶</button></div>
      <div class="seg pv-zoom"><button data-pvzoom="fit" class="${PV.zoom === 'fit' ? 'on' : ''}">Fit</button><button data-pvzoom="1" class="${PV.zoom === '1' ? 'on' : ''}">1:1</button><button data-pvzoom="2" class="${PV.zoom === '2' ? 'on' : ''}">2:1</button></div></div>`;
  const inputs = cfg.upscale.inputs || [];
  if (!inputs.length) return `<div class="preview"><div class="pv-head"><b>Preview</b></div><div class="pv-empty">Choose a folder or files and a side-by-side preview appears here.</div></div>`;
  return `<div class="preview" id="preview">${head}
    <div class="pv-panes">
      <div class="pv-pane"><div class="pv-cap" id="pv-cap-o"><b>Original</b></div><div class="pv-view" id="pv-view-o"><canvas id="pv-o"></canvas></div></div>
      <div class="pv-pane"><div class="pv-cap" id="pv-cap-u"><b>Upscaled</b></div><div class="pv-view" id="pv-view-u"><canvas id="pv-u"></canvas>
        <div class="pv-busy" id="pv-busy" hidden><i></i>Generating preview…</div></div></div>
    </div></div>`;
}

function savePreviewScroll() {
  const v = $('#pv-view-u');
  if (v) PV.scroll = { x: v.scrollLeft, y: v.scrollTop };
}

async function afterRenderPreview() {
  if (!$('#preview')) return;
  const listKey = JSON.stringify([cfg.upscale.inputs, cfg.upscale.subfolders]);
  if (listKey !== PV.listKey && !PV.loadingList) {
    PV.loadingList = true;
    const r = await window.htk.previewList(cfg.upscale.inputs, cfg.upscale.subfolders);
    PV.loadingList = false;
    PV.listKey = listKey;
    PV.list = r.items || []; PV.total = r.total || 0;
    if (!PV.list.some((i) => i.src === PV.src)) PV.src = PV.list.length ? PV.list[0].src : '';
    PV.shown = null; PV.shownKey = '';
  }
  fillPreviewPicker();
  drawPreview();
  schedulePreview();
}

function fillPreviewPicker() {
  const sel = $('#pv-file'); if (!sel) return;
  sel.innerHTML = PV.list.map((i, n) => `<option value="${n}" ${i.src === PV.src ? 'selected' : ''}>${esc(i.rel)}</option>`).join('')
    + (PV.total > PV.list.length ? `<option disabled>… ${PV.total - PV.list.length} more not listed</option>` : '');
  sel.disabled = !PV.list.length;
  document.querySelectorAll('.pv-step').forEach((b) => { b.disabled = PV.list.length < 2; });
}

function schedulePreview() {
  if (!PV.src) return;
  const key = previewKey();
  if (key === PV.shownKey) return;
  const hit = PV.cache.get(key);
  if (hit) { PV.cache.delete(key); PV.cache.set(key, hit); PV.shown = hit; PV.shownKey = key; PV.error = ''; drawPreview(); return; }
  PV.pendingKey = key;
  drawPreview();
  clearTimeout(PV.timer);
  PV.timer = setTimeout(async () => {
    const req = previewParams();
    const r = await window.htk.preview(req);
    if (r.superseded) return;
    if (JSON.stringify(req) !== PV.pendingKey) return; // settings moved on; a newer request is coming
    PV.pendingKey = '';
    if (r.error) { PV.error = r.error; PV.shown = null; PV.shownKey = ''; drawPreview(); return; }
    PV.error = '';
    PV.cache.set(JSON.stringify(req), r);
    let pixels = 0;
    for (const v of PV.cache.values()) pixels += v.up.width * v.up.height;
    while (PV.cache.size > 1 && (PV.cache.size > 10 || pixels > 40e6)) {
      const [k, v] = PV.cache.entries().next().value;
      PV.cache.delete(k); pixels -= v.up.width * v.up.height;
    }
    PV.shown = r; PV.shownKey = JSON.stringify(req);
    drawPreview();
    if (previewKey() !== PV.shownKey) schedulePreview();
  }, 140);
}

function paint(canvas, img) {
  canvas.width = img.width; canvas.height = img.height;
  const d = img.data;
  canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(d.buffer, d.byteOffset, d.length), img.width, img.height), 0, 0);
}

function drawPreview() {
  const vo = $('#pv-view-o'), vu = $('#pv-view-u'), co = $('#pv-o'), cu = $('#pv-u');
  if (!vo || !co) return;
  const busy = $('#pv-busy');
  const stale = PV.shownKey !== previewKey();
  busy.hidden = !(PV.pendingKey && stale);
  vu.querySelectorAll('.pv-msg').forEach((m) => m.remove());
  if (PV.error) vu.insertAdjacentHTML('beforeend', `<div class="pv-msg err">Preview failed: ${esc(PV.error)}</div>`);
  else if (!PV.src) vu.insertAdjacentHTML('beforeend', `<div class="pv-msg">No PNG or DDS textures in the input.</div>`);
  const r = PV.shown;
  if (!r) { co.width = cu.width = 0; return; }
  paint(co, r.orig); paint(cu, r.up);
  const fit = PV.zoom === 'fit';
  [vo, vu].forEach((v) => v.classList.toggle('z1', !fit));
  // Both sides are shown at the same size, so the same spot lines up in each pane.
  const zoomK = PV.zoom === '2' ? 2 : 1;
  let w = r.up.width * zoomK, h = r.up.height * zoomK;
  if (fit) {
    const boxW = vu.clientWidth - 16, boxH = vu.clientHeight - 16;
    const k = Math.min(boxW / w, boxH / h);
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
  }
  for (const c of [co, cu]) { c.style.width = w + 'px'; c.style.height = h + 'px'; }
  co.classList.toggle('px', true);                    // the original always shows its real pixels
  cu.classList.toggle('px', w >= r.up.width);          // smooth when the upscaled image is shrunk to fit
  if (!fit) { vu.scrollLeft = vo.scrollLeft = PV.scroll.x; vu.scrollTop = vo.scrollTop = PV.scroll.y; }
  const item = PV.list.find((i) => i.src === PV.src);
  const ext = item ? item.rel.split('.').pop().toUpperCase() : '';
  $('#pv-cap-o').innerHTML = `<b>Original</b> · ${r.orig.width}×${r.orig.height} · ${ext}`;
  const u = cfg.upscale;
  const how = { standard: 'Standard', smooth: 'Smooth', pixel: 'Pixel art', ai: 'AI' }[u.method] + ' ' + (u.size === 'fit' ? `fit ${u.fit}` : u.size + '×')
    + ((u.method === 'standard' || u.method === 'ai') ? `, ${u.sharpness}` : '');
  $('#pv-cap-u').innerHTML = `<b>Upscaled</b> · ${r.up.width}×${r.up.height} · ${esc(how)} · ${esc(r.encoded)}` + (stale ? ' · updating…' : ` · ${(r.ms / 1000).toFixed(2)} s`);
}

document.addEventListener('scroll', (e) => {
  const v = e.target;
  if (!(v instanceof HTMLElement) || !v.classList.contains('pv-view') || PV.zoom === 'fit') return;
  const other = v.id === 'pv-view-u' ? $('#pv-view-o') : $('#pv-view-u');
  if (other && (other.scrollLeft !== v.scrollLeft || other.scrollTop !== v.scrollTop)) { other.scrollLeft = v.scrollLeft; other.scrollTop = v.scrollTop; }
  PV.scroll = { x: v.scrollLeft, y: v.scrollTop };
}, true);

document.addEventListener('change', (e) => {
  if (e.target.id !== 'pv-file') return;
  const item = PV.list[Number(e.target.value)];
  if (item) { PV.src = item.src; PV.scroll = { x: 0, y: 0 }; drawPreview(); schedulePreview(); }
});

window.addEventListener('resize', () => { if (page === 'upscale') drawPreview(); });

(async function init() {
  S = await window.htk.state();
  cfg = S.settings;
  if (!Array.isArray(cfg.upscale.inputs)) cfg.upscale.inputs = cfg.upscale.inputs ? [cfg.upscale.inputs] : [];
  if (cfg.page === 'unpack') { cfg.page = 'pack'; cfg.pack.mode = 'unpack'; }
  if (!cfg.pack.mode) cfg.pack.mode = 'pack';
  page = !cfg.firstRunDone ? 'setup' : toolsLanding(pages[cfg.page] && cfg.page !== 'setup' ? cfg.page : 'upscale');
  render();
})();
</script>
</body>
</html>
