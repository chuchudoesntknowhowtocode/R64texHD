// Long descriptions scroll slowly up and back, pausing at each end (hover to stop).
function setupDescScroll() {
  const box = $('#rx-desc'); if (!box) return;
  const inner = $('.rx-desc-in', box);
  inner.classList.remove('scroll'); inner.style.removeProperty('--dist');
  requestAnimationFrame(() => {
    const over = inner.scrollHeight - box.clientHeight + 16;
    if (over > 4) { inner.style.setProperty('--dist', `-${over}px`); inner.style.setProperty('--dur', `${Math.max(6, over / 9)}s`); inner.classList.add('scroll'); }
  });
}
// The list and details fill what's left of the page, so only they scroll.
function fitRomPanes() {
  const box = $('.romx'), pg = $('#page'); if (!box || !pg) return;
  const pad = parseFloat(getComputedStyle(pg).paddingBottom) || 0;
  const inner = pg.getBoundingClientRect().top + pg.clientTop + pg.clientHeight;   // inside the page's border
  const h = inner - pad - box.getBoundingClientRect().top - pg.scrollTop - 2;
  box.style.setProperty('--rom-h', `${Math.max(260, Math.floor(h))}px`);
  // The list starts right under the search box, beside the description (as in the design).
  const search = $('#rom-search');
  const lift = search ? Math.max(0, Math.floor(box.getBoundingClientRect().top - search.getBoundingClientRect().bottom - 10)) : 0;
  box.style.setProperty('--rx-lift', `${lift}px`);
}
window.addEventListener('resize', () => { if (page === 'roms') fitRomPanes(); });
function fillRomList() {
  const box = $('#rom-items'); if (!box) return;
  if (!ROMS.list.length) { box.innerHTML = `<div class="rom-empty">${cfg.roms.folder ? (job.running && job.task === 'roms' ? 'Looking for ROMs…' : 'No ROMs listed yet. Press SCAN.') : 'Choose your ROM folder above.'}</div>`; return; }
  const q = ROMS.filter.trim().toLowerCase();
  const shown = q ? ROMS.list.filter((r) => `${r.title} ${r.file} ${r.gameCode} ${r.folder}`.toLowerCase().includes(q)) : ROMS.list;
  let html = '', last = null;
  for (const r of shown) {
    if (r.folder !== last) { last = r.folder; html += `<div class="rom-folder">▸ ${esc(r.folder || '(top folder)')}</div>`; }
    html += `<button class="rom-item ${r.path === ROMS.selected ? 'on' : ''}" data-rom="${esc(r.path)}" data-art="${esc(r.libArt || '')}" title="${esc(r.rel)}">${r.path === ROMS.selected ? rowArt(r.libArt) : ''}
      <b>${esc(r.title)}</b><span>${r.libKey ? '' : '<i class="nolib" title="Not in the N64 library">?</i>'}${r.gameCode ? `${esc(r.gameCode)} · ${esc(REGION_SHORT[r.regionCode] || r.regionCode || '?')}` : 'Homebrew'} · ${esc(r.format)}${/\.zip$/i.test(r.file) ? ' · zip' : ''}</span></button>`;
  }
  box.innerHTML = (q ? `<div class="rom-count">${shown.length.toLocaleString()} of ${ROMS.list.length.toLocaleString()}</div>` : '') + (html || '<div class="rom-empty">Nothing matches.</div>');
}
// The selected row shows the top 40% of its box art on the right, fading in from the left.
const rowArt = (art) => (art ? `<i class="rom-art" style="background-image:url(&quot;${artUrl(art)}&quot;)"></i>` : '');
async function selectRom(file) {
  ROMS.selected = file; ROMS.info = null; ROMS.loading = file;
  document.querySelectorAll('.rom-item').forEach((b) => {
    const on = b.dataset.rom === file; b.classList.toggle('on', on);
    const a = $('.rom-art', b); if (a && !on) a.remove();
    if (on && !a) b.insertAdjacentHTML('afterbegin', rowArt(b.dataset.art));
  });
  drawRomDetail();
  const info = await window.htk.romInfo(file);
  if (ROMS.loading !== file) return;                 // another ROM was picked meanwhile
  ROMS.loading = ''; ROMS.info = info; drawRomDetail();
}
const sizeOf = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(b >= 10485760 ? 0 : 1)} MB` : b >= 1024 ? `${Math.round(b / 1024)} KB` : `${b} bytes`);
const kv = (k, v, cls = '') => `<div class="kv ${cls}"><span>${k}</span><b>${v}</b></div>`;
function drawRomDetail() {
  const el = $('#rom-detail'); if (!el) return;
  drawRomArt();
  if (!ROMS.selected) { el.innerHTML = `<div class="rom-empty big">${pixelIcon('grey', 'menu')}<div>Click a ROM to see its details.</div></div>`; return; }
  const i = ROMS.info;
  if (!i) { el.innerHTML = `<div class="rom-empty big"><div class="pv-busy" style="position:static"><i></i>Reading ROM…</div></div>`; return; }
  if (i.error) { el.innerHTML = `<div class="rom-empty big">${pixelIcon('red', 'x')}<div>${esc(i.error)}</div></div>`; return; }
  const ok = i.checksumOk === true, bad = i.checksumOk === false;
  const z = i.zelda;
  el.innerHTML = `
    <div class="rom-head"><div><div class="rom-title">${esc(i.title)}</div><div class="rom-sub">${i.gameCode ? `${esc(i.gameCode)} · ${esc(i.region)}${i.video ? ` (${i.video})` : ''}` : 'Homebrew (no game code)'} · version 1.${i.version}</div></div>
      <button class="btn" data-open="${esc(i.path)}">Show in folder</button></div>
    <div class="rom-sec">Game</div>
    ${kv('Title', esc(i.title))}${kv('Game code', esc(i.gameCode || '—'))}${kv('Type', esc(i.category))}${kv('Game ID', esc(i.gameId || '—'))}
    ${kv('Region', `${esc(i.region)}${i.video ? ` · ${i.video}` : ''}`)}${kv('Version', `1.${i.version} (revision ${i.version})`)}
    <div class="rom-sec">File</div>
    ${kv('File', esc(i.file) + (i.inner ? ` <small>(contains ${esc(i.inner)})</small>` : ''))}${kv('Folder', esc(i.folder), 'wrap')}
    ${kv('Format', esc(i.formatName))}${kv('Size', `${sizeOf(i.romSize)} · ${i.mbit} Mbit${i.inner ? ` (zip ${sizeOf(i.fileSize)})` : ''}`)}
    ${i.trailingZeros > 0x10000 ? kv('Padding', `${sizeOf(i.trailingZeros)} of empty space at the end`) : ''}
    <div class="rom-sec">Boot and checksum</div>
    ${kv('CIC chip', `${esc(i.cic)}${i.cicNote ? ` <small>${esc(i.cicNote)}</small>` : ''}`)}
    ${kv('Header checksum', `${ok ? pixelIcon('green', '') : bad ? pixelIcon('red', 'x') : pixelIcon('grey', 'menu')} ${esc(i.checksum)}`, 'icon')}
    ${kv('CRC1 / CRC2', `${i.crc1Hex} ${i.crc2Hex}`, 'mono')}${kv('Boot code CRC32', i.bootCrc, 'mono')}
    ${kv('Entry point', '0x' + i.entryHex, 'mono')}${kv('Clock rate', '0x' + i.clockHex, 'mono')}${kv('libultra', esc(i.libultraVersion || '—'))}
    <div class="rom-sec">Hashes (whole ROM, .z64 order)</div>
    ${kv('CRC32', i.crc32, 'mono sel')}${kv('MD5', i.md5, 'mono sel')}${kv('SHA-1', i.sha1, 'mono sel')}
    <div class="rom-sec">Inside the ROM</div>
    <div class="rom-map">${i.layout.map((p) => `<i style="flex:${Math.max(p.end - p.start, i.romSize * 0.04)}" title="${esc(p.name)}: 0x${p.start.toString(16)}–0x${p.end.toString(16)}"><span>${esc(p.name)}</span></i>`).join('')}</div>
    ${i.layout.map((p) => kv(esc(p.name), `0x${p.start.toString(16).toUpperCase()} – 0x${p.end.toString(16).toUpperCase()} · ${sizeOf(p.end - p.start)}`, 'mono')).join('')}
    ${z ? `${kv('File table', `${z.count.toLocaleString()} files (Zelda 64 engine) at 0x${z.table.toString(16).toUpperCase()}`)}
      ${kv('Compressed files', `${z.compressed.toLocaleString()} of ${z.count.toLocaleString()}${z.missing ? ` · ${z.missing} missing` : ''}`)}
      ${z.build ? kv('Build', esc(z.build), 'wrap') : ''}` : ''}`;
}
document.addEventListener('input', (e) => { if (e.target.id === 'rom-search') { ROMS.filter = e.target.value; fillRomList(); $('#rom-items').scrollTop = 0; } });

// ---------------------------------------------------------------- live preview (1 · Upscale)
const PV = { list: [], total: 0, listKey: '', src: '', zoom: 'fit', cache: new Map(), shown: null, shownKey: '', pendingKey: '', split: 0.5,
  error: '', timer: null, scroll: { x: 0, y: 0 }, loadingList: false };

function previewParams() {
  const u = cfg.upscale;
  return { src: PV.src, method: u.method, size: u.size, fit: u.fit, sharpness: u.sharpness, edges: u.edges, hardAlpha: u.hardAlpha,
    format: u.format, ddsFormat: u.ddsFormat, keepCoverage: u.keepCoverage, maxSize: cfg.maxSize, model: cfg.realesrganModel, aiOk: aiOk() };
}
const previewKey = () => JSON.stringify(previewParams());

function previewPanel() {
  const head = `<div class="pv-head"><b>Preview</b>
      <div class="pv-pick"><button class="btn pv-step" data-pvstep="-1" title="Previous texture">◀</button>
        <select id="pv-file" title="Texture to preview"></select>
        <button class="btn pv-step" data-pvstep="1" title="Next texture">▶</button></div>
      <div class="seg pv-zoom"><button data-pvzoom="fit" class="${PV.zoom === 'fit' ? 'on' : ''}">Fit</button><button data-pvzoom="1" class="${PV.zoom === '1' ? 'on' : ''}">1:1</button><button data-pvzoom="2" class="${PV.zoom === '2' ? 'on' : ''}">2:1</button></div></div>`;
  const inputs = cfg.upscale.inputs || [];
  if (!inputs.length) return `<div class="preview"><div class="pv-head"><b>Preview</b></div><div class="pv-empty">Choose a folder or files and a side-by-side preview shows up here.</div></div>`;
  // Before / after: the upscaled image with the original drawn over its left part; drag the line.
  return `<div class="preview" id="preview">${head}
    <div class="pv-caps"><div class="pv-cap" id="pv-cap-o"><b>◀ Original</b></div><div class="pv-cap r" id="pv-cap-u"><b>Upscaled ▶</b></div></div>
    <div class="pv-view" id="pv-view-u"><div class="pv-cmp" id="pv-cmp" style="--x:${Math.round(PV.split * 100)}%"><canvas id="pv-u"></canvas><canvas id="pv-o" class="px"></canvas><div class="pv-line"><i>◀ ▶</i></div></div>
      <div class="pv-busy" id="pv-busy" hidden><i></i>Making preview…</div></div></div>`;
}

function savePreviewScroll() { const v = $('#pv-view-u'); if (v) PV.scroll = { x: v.scrollLeft, y: v.scrollTop }; }

async function afterRenderPreview() {
  if (!$('#preview')) return;
  const listKey = JSON.stringify([cfg.upscale.inputs, cfg.upscale.subfolders]);
  if (listKey !== PV.listKey && !PV.loadingList) {
    PV.loadingList = true;
    const r = await window.htk.previewList(cfg.upscale.inputs, cfg.upscale.subfolders);
    PV.loadingList = false;
    PV.listKey = listKey;
    PV.list = r.items || []; PV.total = r.total || 0;
    if (!PV.list.some((i) => i.src === PV.src)) PV.src = PV.list.length ? PV.list[0].src : '';
    PV.shown = null; PV.shownKey = '';
  }
  fillPreviewPicker(); drawPreview(); schedulePreview();
}

function fillPreviewPicker() {
  const sel = $('#pv-file'); if (!sel) return;
  sel.innerHTML = PV.list.map((i, n) => `<option value="${n}" ${i.src === PV.src ? 'selected' : ''}>${esc(i.rel)}</option>`).join('')
    + (PV.total > PV.list.length ? `<option disabled>… ${PV.total - PV.list.length} more not listed</option>` : '');
  sel.disabled = !PV.list.length;
  document.querySelectorAll('.pv-step').forEach((b) => { b.disabled = PV.list.length < 2; });
}

function schedulePreview() {
  if (!PV.src) return;
  const key = previewKey();
  if (key === PV.shownKey) return;
  const hit = PV.cache.get(key);
  if (hit) { PV.cache.delete(key); PV.cache.set(key, hit); PV.shown = hit; PV.shownKey = key; PV.error = ''; drawPreview(); return; }
  PV.pendingKey = key;
  drawPreview();
  clearTimeout(PV.timer);
  PV.timer = setTimeout(async () => {
    const req = previewParams();
    const r = await window.htk.preview(req);
    if (r.superseded) return;
    if (JSON.stringify(req) !== PV.pendingKey) return;
    PV.pendingKey = '';
    if (r.error) { PV.error = r.error; PV.shown = null; PV.shownKey = ''; drawPreview(); return; }
    PV.error = '';
    PV.cache.set(JSON.stringify(req), r);
    let pixels = 0;
    for (const v of PV.cache.values()) pixels += v.up.width * v.up.height;
    while (PV.cache.size > 1 && (PV.cache.size > 10 || pixels > 40e6)) {
      const [k, v] = PV.cache.entries().next().value;
      PV.cache.delete(k); pixels -= v.up.width * v.up.height;
    }
    PV.shown = r; PV.shownKey = JSON.stringify(req);
    drawPreview();
    if (previewKey() !== PV.shownKey) schedulePreview();
  }, 140);
}

function paint(canvas, img) {
  canvas.width = img.width; canvas.height = img.height;
  const d = img.data;
  canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(d.buffer, d.byteOffset, d.length), img.width, img.height), 0, 0);
}

function drawPreview() {
  const vu = $('#pv-view-u'), co = $('#pv-o'), cu = $('#pv-u'), cmp = $('#pv-cmp');
  if (!vu || !co) return;
  const busy = $('#pv-busy');
  const stale = PV.shownKey !== previewKey();
  busy.hidden = !(PV.pendingKey && stale);
  vu.querySelectorAll('.pv-msg').forEach((m) => m.remove());
  if (PV.error) vu.insertAdjacentHTML('beforeend', `<div class="pv-msg err">Preview failed: ${esc(PV.error)}</div>`);
  else if (!PV.src) vu.insertAdjacentHTML('beforeend', `<div class="pv-msg">No PNG or DDS textures in the input.</div>`);
  const r = PV.shown;
  if (!r) { co.width = cu.width = 0; cmp.style.width = cmp.style.height = '0px'; return; }
  paint(co, r.orig); paint(cu, r.up);
  const fit = PV.zoom === 'fit';
  vu.classList.toggle('z1', !fit);
  const zoomK = PV.zoom === '2' ? 2 : 1;
  let w = r.up.width * zoomK, h = r.up.height * zoomK;
  if (fit) {
    const boxW = vu.clientWidth - 16, boxH = vu.clientHeight - 16;
    const k = Math.min(boxW / w, boxH / h);
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
  }
  cmp.style.width = w + 'px'; cmp.style.height = h + 'px';
  for (const c of [co, cu]) { c.style.width = w + 'px'; c.style.height = h + 'px'; }
  cu.classList.toggle('px', w >= r.up.width);
  if (!fit) { vu.scrollLeft = PV.scroll.x; vu.scrollTop = PV.scroll.y; }
  const item = PV.list.find((i) => i.src === PV.src);
  const ext = item ? item.rel.split('.').pop().toUpperCase() : '';
  $('#pv-cap-o').innerHTML = `<b>◀ Original</b> · ${r.orig.width}×${r.orig.height} · ${ext}${r.edges ? ` · edges: ${esc(r.edges)}` : ''}`;
  const u = cfg.upscale;
  const how = (u.method === 'smart' ? `Smart → ${r.route || '…'}` : { standard: 'Standard', smooth: 'Smooth', pixel: 'Pixel art', ai: 'AI' }[u.method] + ' ' + (u.size === 'fit' ? `fit ${u.fit}` : u.size + '×')
    + ((u.method === 'standard' || u.method === 'ai') ? `, ${u.sharpness}` : ''));
  $('#pv-cap-u').innerHTML = `${esc(how)} · ${r.up.width}×${r.up.height} · ${esc(r.encoded)}` + (stale ? ' · updating…' : ` · ${(r.ms / 1000).toFixed(2)} s`) + ' <b>Upscaled ▶</b>';
}
// Drag the before / after line (or click anywhere on the image). Arrow keys nudge it.
function setSplit(x) { PV.split = Math.max(0, Math.min(1, x)); const c = $('#pv-cmp'); if (c) c.style.setProperty('--x', (PV.split * 100).toFixed(2) + '%'); }
document.addEventListener('pointerdown', (e) => {
  const c = e.target.closest('#pv-cmp'); if (!c || e.button !== 0) return;
  e.preventDefault(); c.setPointerCapture(e.pointerId);
  const at = (ev) => { const r = c.getBoundingClientRect(); setSplit((ev.clientX - r.left) / r.width); };
  at(e);
  const move = (ev) => at(ev), up = () => { c.removeEventListener('pointermove', move); c.removeEventListener('pointerup', up); c.removeEventListener('pointercancel', up); };
  c.addEventListener('pointermove', move); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
});

document.addEventListener('scroll', (e) => {
  const v = e.target;
  if (!(v instanceof HTMLElement) || !v.classList.contains('pv-view') || PV.zoom === 'fit') return;
  PV.scroll = { x: v.scrollLeft, y: v.scrollTop };
}, true);

document.addEventListener('change', (e) => {
  if (e.target.id !== 'pv-file') return;
  const item = PV.list[Number(e.target.value)];
  if (item) { PV.src = item.src; PV.scroll = { x: 0, y: 0 }; drawPreview(); schedulePreview(); }
});

// Back in the app (maybe after dumping more textures): look at the input again.
window.addEventListener('focus', () => { if (cfg && !job.running && !job.result && !job.error) recheck(); });
window.addEventListener('resize', () => { if (page === 'upscale') drawPreview(); });

setTimeout(() => { if (!$('#splash').hidden) hideSplash(); else showApp(); }, 6000);   // never leave the app hidden, whatever happens during start-up
(async function init() {
  S = await window.htk.state();
  cfg = withDefaults(S.settings);
  $('#ver').textContent = 'v' + S.version;
  applyNavFold();
  if (!Array.isArray(cfg.upscale.inputs)) cfg.upscale.inputs = cfg.upscale.inputs ? [cfg.upscale.inputs] : [];
  if (cfg.page === 'unpack') { cfg.page = 'pack'; cfg.pack.mode = 'unpack'; }
  if (cfg.page === 'setup') cfg.page = 'welcome';
  const firstRun = !cfg.firstRunDone;
  page = firstRun || !pages[cfg.page] ? 'welcome' : cfg.page;
  cfg.page = page;
  if (firstRun) { cfg.firstRunDone = true; save(true); }
  whenSplashGone(() => { const shown = askTools(firstRun ? 'welcome' : ''); if (firstRun) { if (shown) geoAfterTools = true; else askGeo(); } });
  Wizard.init({ settings: wizardSettings, wins: () => cfg.wizardWins || 0, addWin: () => { cfg.wizardWins = (cfg.wizardWins || 0) + 1; save(true); },
    bonusAt: () => cfg.wizardBonusAt || 0, setBonusAt: (w) => { cfg.wizardBonusAt = w; save(true); }, goToJob: goToJobPage,
    onLibrary: () => { if (page === 'settings') render(); } });
  fillGpu();
  Music.init({ settings: musicSettings, onTrack: (n) => { const el = $('#now-playing'); if (el) el.innerHTML = nowPlaying(n); } }).then(() => { if (page === 'settings') render(); });
  render();
  maybeScanRoms();
  whenSplashGone(askRomFolder);                        // after the splash, so the dialog isn't hidden behind it
  nextHeaderPhrase();
  showSplash();
})();
</script>
