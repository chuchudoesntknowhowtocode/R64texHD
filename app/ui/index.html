<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>R64texHD - HD Texture Toolkit for N64</title>
<style>
:root {
  --bg: #130a22; --panel: #1c1131; --panel-2: #170c29; --field: #27193f; --field-hover: #33214f; --line: #30204a;
  --text: #f8eff5; --muted: #ab98ba; --orange: #ff8d7a; --orange-hi: #ffb596; --ink: #2b0b28;
  --card: var(--orange); --card-line: var(--orange-hi); --good: #3fcf7a; --warn: #ffc44d; --bad: #ff6464; --r: 12px;
  --pink: #e9508a; --cyan: #ffb596; --violet: #a865d6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
button, input { font: inherit; color: inherit; }
input { user-select: text; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

header { position: relative; height: 176px; padding: 0 28px; overflow: hidden; display: flex; align-items: center; background: #130a22; }
/* Header artwork: the banner's left side is plain background, so it simply sits on the right and fills the height. */
.hdr-art { position: absolute; top: 0; right: 0; height: 100%; width: auto; z-index: 0; pointer-events: none; }
.hdr-text { position: relative; z-index: 2; }
h1 { margin: 0; white-space: nowrap; font-size: 27px; font-weight: 800; letter-spacing: .3px; text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(19,10,34,.9); }
/* Version: top right corner of the header. */
.ver { position: absolute; top: 10px; right: 16px; z-index: 3; font-size: 12px; font-weight: 700; letter-spacing: .5px; color: rgba(248,239,245,.75);
  padding: 3px 0; background: transparent; text-shadow: 0 1px 2px rgba(0,0,0,.7); pointer-events: none; }
.sub { margin-top: 12px; color: var(--orange); font-size: 13.5px; font-weight: 600; max-width: 560px; line-height: 1.5; text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 0 14px rgba(19,10,34,.95); }
.sub span { white-space: nowrap; }
/* The subtitle is the catchphrase: a new one on every page switch. */
#sub.swap { animation: sub-swap .35s ease; }
@keyframes sub-swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

main { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 22px; padding: 0 18px; min-height: 0; position: relative; z-index: 1; }
nav { background: var(--panel); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
nav .grp { margin: 10px 14px 2px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #7d6896; }
nav .grp:first-child { margin-top: 4px; }
nav button { all: unset; cursor: pointer; padding: 11px 14px; border-radius: 8px; font-weight: 600; display: flex; gap: 12px; align-items: center; }
nav button .n { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; background: var(--field); color: var(--muted); flex: none; }
nav button:hover { background: var(--field); }
nav button.active { background: var(--orange); color: var(--ink); box-shadow: 0 2px 10px rgba(255,141,122,.25); }
nav button.active .n { background: rgba(43,11,40,.18); color: var(--ink); }
nav button:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
nav .spacer { flex: 1; }
/* Six pages plus Settings / About: a little tighter so all fit at 800 px high, and never squashed. */
nav > *, nav button { flex-shrink: 0; }   /* "all: unset" on buttons would bring shrinking back */
nav { gap: 4px; }
nav button { padding: 8px 14px; }
nav .grp { margin-top: 8px; }
nav.locked button { pointer-events: none; opacity: .45; }

.page { background: var(--panel); border-radius: var(--r); padding: 22px 26px 18px; overflow: auto; min-height: 0; }
.page h2 { margin: 0; font-size: 19px; font-weight: 700; }
.lead { margin: 10px 0 20px; color: var(--muted); max-width: 760px; }
.section { margin: 22px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--orange); }

.card { display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: var(--r); background: var(--card); border: 1px solid var(--card-line); margin-bottom: 22px; min-height: 76px; }
.card .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--orange); flex: none; box-shadow: 0 0 0 4px rgba(255,141,122,.12); }
.card.idle { background: #23173c; border-color: #3b2756; } .card.idle .dot { background: #6e5a8c; box-shadow: none; }
.card.error { background: #4a1820; border-color: #6d2430; } .card.error .dot { background: var(--bad); }
.card.done .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(63,207,122,.15); }
.card .body { flex: 1; min-width: 0; }
.card .t { font-weight: 700; }
.card .p { margin-top: 6px; color: #fbe9e2; word-break: break-all; font-size: 13.5px; white-space: pre-line; }
.card .bar { margin-top: 10px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; }
.card .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--orange-hi)); transition: width .25s; }
.card .act { flex: none; display: flex; gap: 8px; }
/* Orange cards (ready, working, done, notices) use the same bright orange as the menu, with dark text. */
.card:not(.idle):not(.error) { color: var(--ink); }
.card:not(.idle):not(.error) .p { color: rgba(43,11,40,.82); }
.card:not(.idle):not(.error):not(.done) .dot { background: var(--ink); box-shadow: 0 0 0 4px rgba(43,11,40,.15); }
.card.done .dot { box-shadow: 0 0 0 4px rgba(43,11,40,.18); }
.card:not(.idle):not(.error) .bar { background: rgba(43,11,40,.22); }
.card:not(.idle):not(.error) .bar i { background: var(--ink); }
.card:not(.idle):not(.error) .btn { background: rgba(43,11,40,.14); color: var(--ink); font-weight: 600; }
.card:not(.idle):not(.error) .btn:hover { background: rgba(43,11,40,.24); }
.card:not(.idle):not(.error) .btn.primary { background: var(--ink); color: var(--orange-hi); }
.card:not(.idle):not(.error) .btn.primary:hover { background: #3d1236; }
.card:not(.idle):not(.error) .tool { color: rgba(43,11,40,.75); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: center; padding: 10px 0 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row .l b { display: block; font-weight: 600; }
.row .l small { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.row[hidden] { display: none; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-width: 0; padding: 7px 8px; border: 0; border-radius: 7px; background: var(--field); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button:hover { background: var(--field-hover); }
.seg button.on { background: var(--orange); color: var(--ink); font-weight: 600; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg.modes { background: var(--panel-2); padding: 5px; border-radius: 10px; border: 1px solid var(--line); }
.seg.modes button { padding: 9px 8px; background: transparent; }
.seg.modes button:hover { background: var(--field); }
.seg.modes button.on { background: var(--orange); }
.path { display: flex; gap: 8px; }
.path input, .text { flex: 1; min-width: 0; width: 100%; padding: 7px 12px; border: 1px solid transparent; border-radius: 7px; background: var(--field); }
.path input:focus, .text:focus { border-color: #563b7a; outline: none; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { padding: 7px 16px; border: 0; border-radius: 7px; background: var(--field); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--field-hover); }
.btn.primary { background: var(--orange); color: var(--ink); font-weight: 600; }
.btn.primary:hover { background: var(--orange-hi); }
.btn:disabled { opacity: .5; cursor: default; }
.seg button:focus-visible, .btn:focus-visible, .path input:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
.tool { margin-top: 6px; color: var(--muted); font-size: 12.5px; word-break: break-all; }
.tool.ok { color: var(--good); }
.card.notice { background: var(--orange); border-color: var(--orange-hi); }
.card.notice .p { word-break: normal; }
.card.notice ul { margin: 8px 0 0; padding-left: 18px; color: rgba(43,11,40,.85); font-size: 13.5px; }
nav button .badge { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-left: auto; box-shadow: 0 0 0 3px rgba(255,141,122,.18); }
nav button.active .badge { background: var(--ink); box-shadow: none; }
.log { margin-top: 18px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font: 12px/1.5 "Cascadia Mono", Consolas, monospace; color: #d3c6dd; max-height: 150px; overflow: auto; white-space: pre-wrap; user-select: text; }
.log:empty { display: none; }

/* tip strip: one friendly line about how this page fits in */
.tip { display: flex; gap: 12px; align-items: flex-start; margin: -6px 0 20px; padding: 11px 14px; border-radius: 10px; background: rgba(255,181,150,.06); border: 1px solid rgba(255,181,150,.2); color: #f3d9e8; font-size: 13px; }
.tip b { color: #fff0f5; }
.tip .i { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: rgba(255,181,150,.18); color: var(--cyan); }

/* recomp info box */
.box { margin-top: 6px; padding: 4px 16px 6px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.box[hidden] { display: none; }
.thumb { display: flex; gap: 10px; align-items: center; }
.thumb .sq { width: 64px; height: 64px; border-radius: 8px; flex: none; border: 1px dashed #5b3b81; display: grid; place-items: center; color: var(--muted); font-size: 11px; overflow: hidden; }
.thumb .sq img { width: 100%; height: 100%; object-fit: cover; }

/* check results */
.checks { margin: 0 0 18px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
.checks .c { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; background: var(--panel-2); }
.checks .c + .c { border-top: 1px solid var(--line); }
.checks .c i { flex: none; width: 18px; height: 18px; border-radius: 50%; margin-top: 1px; font-style: normal; font-size: 11px; font-weight: 900; display: grid; place-items: center; color: var(--ink); }
.checks .c.ok i { background: var(--good); } .checks .c.warn i { background: var(--warn); } .checks .c.bad i { background: var(--bad); }
.checks .c b { display: block; font-weight: 600; }
.checks .c span { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
.checks .c .fix { margin-left: auto; flex: none; }

/* game chips (ports page) */
.games { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 5px 11px; border-radius: 20px; background: var(--field); font-size: 12.5px; color: var(--muted); }
.chip.on { background: rgba(255,141,122,.16); color: var(--orange-hi); box-shadow: inset 0 0 0 1px rgba(255,141,122,.45); }

/* The footer stage: the 890 x 100 strip the wizard scenes were drawn on (assets/scenes, wizard.js). The bar is
   the app's only progress bar; scene layers sit under the real buttons (pipe = Home, Quit). Fixed width: the
   window grows between Save and the big button. */
footer { position: relative; height: 100px; flex: none; }
.stage { position: absolute; left: 0; top: 0; width: 890px; height: 100px; background: url("../assets/scenes/stage.png") 0 0 / 890px 100px no-repeat; image-rendering: pixelated; }
.stage canvas, .stage .fx-click { position: absolute; left: 0; top: 0; width: 890px; height: 100px; image-rendering: pixelated; pointer-events: none; }
.stage .fx-click { pointer-events: auto; background: none; border: 0; padding: 0; }
#fx-world { z-index: 1; } #fx-bar { z-index: 2; } #fx-sprite { z-index: 3; } #fx-fx { z-index: 4; } .stage .fx-click { z-index: 4; }
.stage .home-btn { position: absolute; left: 16px; top: 14px; margin: 0; z-index: 5; }
.stage #quit { position: absolute; left: 742px; top: 27px; z-index: 5; }
footer #save { position: absolute; left: 886px; top: 27px; z-index: 5; }
footer #go { position: absolute; right: 18px; top: 21px; z-index: 5; }
body.job-on .stage .fx-click { cursor: pointer; }
/* While a job runs on this page: its status card stays at the top, its options are locked (Cancel still works). */
#page.locked #status { position: sticky; top: 0; z-index: 6; }
#page.locked .row:not(:has(#status)), #page.locked .seg, #page.locked .path, #page.locked .games { pointer-events: none; opacity: .55; filter: saturate(.6); }
.card .bar { display: none !important; }   /* the footer bar is the only progress bar now */
/* First launch: "Battle the secrets of Sacred Geometry?" (turning Flower of Life, rainbow border). */
.geo-ask { position: relative; }
.geo-ask h3 { font-size: 20px; margin: 0 0 6px; position: relative; z-index: 1; }
.geo-ask p, .geo-ask .buttons { position: relative; z-index: 1; }
.geo-ask .fol { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; }
.geo-ask .later { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 700; opacity: 0; z-index: 2; pointer-events: none; }
#dialog.trippy { border-color: transparent !important; box-shadow: 0 0 0 3px var(--rb, #ff4fd8), 0 20px 60px rgba(0,0,0,.5) !important; }
#geo-parts { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 30; image-rendering: pixelated; }
.home-btn { all: unset; flex: none; width: 69px; height: 69px; cursor: pointer; margin: 0 -14px -6px 0; align-self: flex-end; position: relative; z-index: 1;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,.5)); transition: transform .1s steps(2); }
.home-btn img { display: block; width: 69px; height: 69px; image-rendering: pixelated; }
/* 8-bit shine: a stepped band of light sweeps across the pipe on hover, cut to the pipe's own shape. */
.home-btn::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(105deg, transparent 0 42%, rgba(255,255,255,.42) 42% 46%, transparent 46% 49%, rgba(255,255,255,.24) 49% 51%, transparent 51%) no-repeat;
  background-size: 300% 100%; background-position: 100% 0;
  clip-path: polygon(2px 7px, 35px 7px, 35px 2px, 67px 2px, 67px 67px, 35px 67px, 35px 62px, 2px 62px); }
.home-btn:hover { transform: translateY(-3px); filter: drop-shadow(3px 6px 0 rgba(0,0,0,.45)) brightness(1.08); }
.home-btn:hover::after { opacity: 1; animation: pipe-shine .6s steps(8) 1 forwards; }
@keyframes pipe-shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
.home-btn.on { filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 6px rgba(255,255,255,.75)); }
@media (prefers-reduced-motion: reduce) { .home-btn:hover::after { animation: none; opacity: 0; } }
.home-btn:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 3px; }
/* The helper tools question: short and plain. */
.ask-tools { min-width: 340px; }
.ask-tools h3 { margin: 0 0 4px; font-size: 20px; }
.ask-tools > p { margin: 0 0 14px; color: var(--muted); }
.ask-tools ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.ask-tools li { display: grid; grid-template-columns: 18px auto 1fr; align-items: center; gap: 10px; }
.ask-tools li .px-icon { width: 16px; height: 16px; }
.ask-tools li span { color: var(--muted); font-size: 12.5px; }
.ask-tools .tool:empty { display: none; }
.foot-btn { width: 130px; height: 50px; border: 0; border-radius: 12px; background: var(--field); font-size: 14.5px; cursor: pointer; }
.foot-btn:hover { background: var(--field-hover); }
.go { min-width: 214px; padding: 0 26px; height: 58px; border: 0; border-radius: 30px; cursor: pointer; font-size: 17px; font-weight: 800; letter-spacing: .6px; color: var(--ink);
  background: linear-gradient(180deg, var(--orange-hi), var(--orange)); box-shadow: 0 0 0 3px #2b0b28, 0 0 0 5px rgba(255,141,122,.55), 0 6px 22px rgba(255,141,122,.25); }
.go:hover { filter: brightness(1.06); }
.go:active { transform: translateY(1px); }
.go.cancel { background: linear-gradient(180deg, #4d3571, #3a2758); color: var(--text); box-shadow: 0 0 0 3px #170c27, 0 0 0 5px #4d3571; }

.modal { position: fixed; inset: 0; background: rgba(12,5,20,.72); display: grid; place-items: center; z-index: 10; }
.modal[hidden] { display: none; }
.dialog { width: min(520px, calc(100vw - 32px)); background: var(--panel); border: 1px solid #3a2658; border-radius: 16px; padding: 24px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.dialog h3 { margin: 0 0 10px; font-size: 18px; }
.dialog p { margin: 0 0 22px; color: var(--muted); }
.dialog .buttons { display: flex; gap: 10px; justify-content: flex-end; }
.dialog .buttons .btn { padding: 10px 18px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #47305f; border-radius: 6px; border: 2px solid var(--panel); }
::-webkit-scrollbar-thumb:hover { background: #55397a; }
.preview { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 12px 16px 14px; margin-bottom: 22px;
  position: sticky; top: -22px; z-index: 3; box-shadow: 0 10px 24px rgba(12,5,20,.55); }
.pv-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.pv-head > b { font-weight: 700; flex: none; }
.pv-pick { display: flex; gap: 6px; flex: 1; min-width: 0; }
.pv-pick select { flex: 1; min-width: 0; background: var(--field); color: var(--text); border: 0; border-radius: 7px; padding: 7px 10px; font: inherit; }
.pv-pick select:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
.pv-step { padding: 7px 11px; }
.pv-zoom { width: 190px; flex: none; }
.pv-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pv-cap { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-cap b { color: var(--text); font-weight: 600; }
.pv-view { position: relative; height: clamp(180px, calc(100vh - 620px), 360px); border-radius: 10px; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line);
  background-color: #1f1436; background-image: conic-gradient(#2c1b46 25%, transparent 0 50%, #2c1b46 0 75%, transparent 0); background-size: 16px 16px; }
.pv-view.z1 { display: block; overflow: auto; }
.pv-view.z1 canvas { display: block; margin: 0 auto; }
.pv-view canvas.px { image-rendering: pixelated; }
.pv-busy { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; background: rgba(19,10,34,.88); border: 1px solid #47305f; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
.pv-busy[hidden] { display: none; }
.pv-busy i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--orange); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pv-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
.pv-msg.err { color: var(--bad); }
.pv-empty { height: 90px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #3b2657; border: 1px solid #5b3b81; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
.about p { color: var(--muted); max-width: 820px; }
.about p b { color: var(--text); }
.repo { display: flex; align-items: center; gap: 16px; margin-top: 26px; padding: 16px 20px; border-radius: var(--r); background: #1e1335; border: 1px solid #3b2756; }
.repo svg { width: 30px; height: 30px; flex: none; fill: var(--text); }
.repo .rt { flex: 1; min-width: 0; } .repo .rt b { display: block; } .repo .rt span { color: var(--muted); font-size: 13px; word-break: break-all; }
@media (max-width: 1240px) { h1 { font-size: 21px; } .sub { font-size: 12.5px; max-width: 420px; } }

/* Pixelfy (the splash catchphrase): see fonts/Pixelfy-LICENSE.txt, its own terms, not GPL. */
@font-face { font-family: "Pixelfy"; src: url("fonts/Pixelfy.ttf") format("truetype"); font-display: block; }
/* ---------------------------------------------------------------- splash (5 s: fade in, hold, fade out; the app appears at 4.5 s) */
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 45%, #1c0c3a 0%, #0b0618 55%, #05030c 100%);
  animation: splash-life 5s ease-in-out forwards; }
#splash[hidden] { display: none; }
#splash .inner { display: flex; flex-direction: column; align-items: center; width: min(92vw, 980px); }
#splash img { cursor: pointer; width: 100%; height: auto; filter: drop-shadow(0 0 30px rgba(233,80,138,.35));
  animation: splash-logo 5s cubic-bezier(.2,.8,.2,1) forwards; }
#splash .grid { position: absolute; inset: 55% 0 0 0; pointer-events: none; opacity: .35;
  background-image: linear-gradient(rgba(233,80,138,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,181,150,.4) 1px, transparent 1px);
  background-size: 60px 30px; transform: perspective(380px) rotateX(62deg); transform-origin: top; mask-image: linear-gradient(transparent, #000 40%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 40%, transparent); }
.phrase { position: relative; margin-top: -6px; padding: 0 20px; text-align: center; font-weight: 400; font-style: normal;
  font-size: var(--phrase-size, 32.8px); letter-spacing: 0; text-transform: uppercase; line-height: 1.2; white-space: nowrap;   /* always one line */
  width: 96vw; box-sizing: border-box; flex: none;   /* may be wider than the logo; the column centres it */
  font-family: "Pixelfy", "Segoe UI Black", system-ui, sans-serif; -webkit-font-smoothing: none; font-smooth: never;
  /* a 2 px black outline (one Pixelfy pixel at 32.8 px), then the cyan / magenta glow around it */
  color: #fff; filter: drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000)
    drop-shadow(0 0 6px rgba(63,232,255,.6)) drop-shadow(0 0 18px rgba(255,79,216,.55));
  opacity: 0; animation: phrase-in 5s cubic-bezier(.2,.9,.25,1) forwards; }
/* Two-tone: the first half cyan, the punchline magenta; a white glint sweeps across each. */
.phrase .p1, .phrase .p2 { -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background-size: 300% 100%;
  animation: phrase-shine 1.6s linear .5s infinite; }
.phrase .p1 { background-image: linear-gradient(90deg, #3fe8ff 0 46%, #fff 50%, #3fe8ff 54% 100%); }
.phrase .p2 { background-image: linear-gradient(90deg, #ff4fd8 0 46%, #fff 50%, #ff4fd8 54% 100%); }
/* chromatic glitch copies behind the text */
.phrase::before, .phrase::after { content: attr(data-text); position: absolute; inset: 0; padding: 0 20px; -webkit-text-fill-color: currentColor; background: none; pointer-events: none; mix-blend-mode: screen; opacity: .8; }
.phrase::before { color: #3fe8ff; opacity: .45; animation: glitch-a 5s steps(1) forwards; }
.phrase::after { color: #ff4fd8; opacity: .45; animation: glitch-b 5s steps(1) forwards; }
.phrase-sub { margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: 4px; color: rgba(255,255,255,.55); text-transform: uppercase; opacity: 0; animation: phrase-sub 5s ease forwards; }
@keyframes splash-life { 0% { opacity: 0; } 12.6% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
/* The app stays out of sight until the splash starts fading (4.5 s), then fades in under it. */
.app { transition: opacity .5s ease; }
.app.waiting { opacity: 0; pointer-events: none; }
@keyframes splash-logo { 0% { transform: scale(.92); filter: drop-shadow(0 0 0 rgba(233,80,138,0)) brightness(.6); } 30% { transform: scale(1); filter: drop-shadow(0 0 34px rgba(233,80,138,.45)) brightness(1.08); } 100% { transform: scale(1.03); } }
@keyframes phrase-in {
  0%, 18% { opacity: 0; transform: translateY(14px) scale(1.25) skewX(-8deg); letter-spacing: 10px; filter: blur(8px); }
  32% { opacity: 1; transform: translateY(0) scale(1) skewX(-8deg); letter-spacing: .5px; filter: drop-shadow(0 0 10px rgba(233,80,138,.85)) drop-shadow(0 0 24px rgba(168,101,214,.6)); }
  36% { transform: translateY(0) scale(1.06) skewX(-8deg); }
  40%, 100% { opacity: 1; transform: translateY(0) scale(1) skewX(-8deg); } }
@keyframes phrase-shine { to { background-position: -220% 0; } }
@keyframes glitch-a { 0%, 30% { transform: translate(0); opacity: 0; } 31% { transform: translate(-4px, 1px); opacity: .9; } 34% { transform: translate(3px, -1px); } 37% { transform: translate(-2px, 0); } 40% { transform: translate(0); opacity: 0; }
  62% { transform: translate(-3px, 0); opacity: .8; } 64% { transform: translate(0); opacity: 0; } 100% { opacity: 0; } }
@keyframes glitch-b { 0%, 30% { transform: translate(0); opacity: 0; } 31% { transform: translate(4px, -1px); opacity: .9; } 34% { transform: translate(-3px, 1px); } 37% { transform: translate(2px, 0); } 40% { transform: translate(0); opacity: 0; }
  62% { transform: translate(3px, 0); opacity: .8; } 64% { transform: translate(0); opacity: 0; } 100% { opacity: 0; } }
@keyframes phrase-sub { 0%, 34% { opacity: 0; } 46%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .phrase, .phrase::before, .phrase::after, #splash img { animation-duration: .01s; } .phrase { opacity: 1; } }

/* ================================================================ 8-bit layer
   Square "stepped" corners, bevelled buttons, chunky progress bar, pixel status buttons
   (pixel-icons.js) and scanlines on the header art. Text stays in the regular font so it
   is sharp at every size; titles get hard pixel drop shadows instead.                     */
:root { --r: 0px; --step: 4px;
  --notch: polygon(0 var(--step), var(--step) var(--step), var(--step) 0, calc(100% - var(--step)) 0, calc(100% - var(--step)) var(--step), 100% var(--step),
    100% calc(100% - var(--step)), calc(100% - var(--step)) calc(100% - var(--step)), calc(100% - var(--step)) 100%, var(--step) 100%, var(--step) calc(100% - var(--step)), 0 calc(100% - var(--step))); }
.px-icon { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

/* retro text: regular font, hard 1-2px drop shadows (sharp, no blur) */
h1 { text-shadow: 3px 3px 0 #000; }
.page h2 { text-shadow: 2px 2px 0 #000; letter-spacing: .4px; }
.section, nav .grp { text-shadow: 1px 1px 0 #000; letter-spacing: 1.2px; }
nav button { white-space: nowrap; }
nav button .n { border-radius: 0; }
.go { text-shadow: 1px 1px 0 rgba(255,255,255,.35); }
.ver { text-shadow: 1px 1px 0 #000; }

/* square, stepped corners everywhere */
.card, .preview, nav, .page, .btn, .seg button, .seg.modes, .path input, .text, .go, .foot-btn, .checks, .tip, .box, .dialog, .toast,
.pv-view, nav button, nav button .n, .chip, .log, .pv-pick select, .thumb .sq { border-radius: 0 !important; clip-path: var(--notch); }
.btn, .seg button, .path input, .text, .pv-pick select, .chip, nav button .n { --step: 2px; }
.go { --step: 6px; }

/* panels: a hard 2px pixel frame */
/* Pane frames sit in a 6 px border outside the scrolling area, so scrolled text always stops a few
   pixels short of the frame instead of sliding over it. The 2 px frame line is drawn in that border. */
nav, .page { --frame: #3b2657; border: 6px solid transparent; box-shadow: none; background-color: var(--panel); background-origin: border-box; background-clip: border-box;
  background-image: linear-gradient(var(--frame), var(--frame)), linear-gradient(var(--frame), var(--frame)), linear-gradient(var(--frame), var(--frame)),
    linear-gradient(var(--frame), var(--frame)), linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18));
  background-size: 100% 2px, 100% 2px, 2px 100%, 2px 100%, 100% 6px; background-repeat: no-repeat;
  background-position: left top, left bottom, left top, right top, left bottom; }
.page { padding: 16px 20px 14px; }
nav { padding: 4px; }
.preview { top: -16px; }
.preview, .box, .checks, .log { box-shadow: inset 0 0 0 2px #3b2657; border: 0; }
.preview { box-shadow: inset 0 0 0 2px #462d64; }
.row + .row { border-top: 2px dotted #3b2657; }

/* bevelled buttons: light top edge, dark bottom edge, press down when clicked */
.btn, .seg button, .foot-btn { box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.35); }
.seg button.on, .btn.primary, nav button.active { box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(122,30,52,.55); }
.btn:active, .seg button:active, .foot-btn:active { transform: translateY(1px); box-shadow: inset 0 3px 0 rgba(0,0,0,.35); }
.seg.modes button { box-shadow: none; }
.seg.modes button.on { box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(122,30,52,.55); }
.go { border: 0; background: var(--orange); box-shadow: inset 0 0 0 3px #2b0b28, inset 0 6px 0 #ffd2b6, inset 0 -7px 0 #b4525d; height: 60px; }
.go:hover { filter: brightness(1.07); }
.go:active { transform: translateY(2px); box-shadow: inset 0 0 0 3px #2b0b28, inset 0 6px 0 #b4525d; }
.go.cancel { background: #4d3571; box-shadow: inset 0 0 0 3px #170c27, inset 0 6px 0 #715a90, inset 0 -7px 0 #2c1d49; }
.path input, .text, .pv-pick select { box-shadow: inset 0 3px 0 rgba(0,0,0,.35); border: 0; }
.path input:focus, .text:focus { box-shadow: inset 0 3px 0 rgba(0,0,0,.35), inset 0 0 0 2px var(--orange); }

/* orange cards get a chunky bevel too */
.card { border: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }
.card:not(.idle):not(.error) { box-shadow: inset 0 4px 0 rgba(255,255,255,.28), inset 0 -6px 0 rgba(122,30,52,.45); }
.card.idle { box-shadow: inset 0 0 0 2px #462d64, inset 0 -5px 0 rgba(0,0,0,.25); }
.card.error { box-shadow: inset 0 0 0 2px #7d2a36, inset 0 -5px 0 rgba(0,0,0,.3); }

/* pixel status buttons */
.card .dot { width: 32px; height: 32px; border: 0 !important; border-radius: 0; background: none !important; box-shadow: none !important; }
.card.running .dot { animation: px-blink 1s steps(1) infinite; }
@keyframes px-blink { 50% { opacity: .35; } }
.checks .c i { width: 32px; height: 32px; border: 0 !important; background: none !important; margin: -6px 0 -6px -4px; }
nav button .badge { width: 16px; height: 16px; border: 0 !important; background: none !important; box-shadow: none !important; border-radius: 0; }
.tool-state { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; font-weight: 700; }
.tool-state svg { width: 16px; height: 16px; flex: none; }
.tool-state.have { color: var(--good); } .tool-state.missing { color: #ff7a6e; }

/* chunky, segmented progress bar */
.card .bar { height: 12px; border-radius: 0; background: rgba(43,11,40,.25); box-shadow: inset 0 0 0 2px rgba(43,11,40,.5); padding: 2px; }
.card .bar i { background: repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 10px) !important; transition: width .25s steps(6); }

/* square scrollbars, checkerboard preview, tips and chips */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { border-radius: 0; background: #46306b; border: 3px solid var(--panel); }
::-webkit-scrollbar-thumb:hover { background: #62428c; }
.tip { border: 0; box-shadow: inset 0 0 0 2px rgba(255,181,150,.3); }
.tip .i { border-radius: 0; }
.chip { font-size: 12px; }
.pv-view { border: 0; box-shadow: inset 0 0 0 2px #3b2657; background-size: 12px 12px; }

/* faint CRT scanlines on the header art only, so text is never softened */
header::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
.hdr-text, .ver { z-index: 3; }
.welcome-art { display: block; width: 100%; height: auto; max-height: 230px; object-fit: cover; margin: 0 0 18px; image-rendering: pixelated;
  clip-path: var(--notch); box-shadow: inset 0 0 0 2px var(--line); }

/* ================================================================ silver pixel buttons
   Polished-metal plates in the style of a pixel-art menu bar: diagonal light streaks on brushed
   silver, a bright inner rim, a dark pixel outline, chunky bevels, and a shine that sweeps across.
   Used for the selected / main buttons (menu item, chosen options, primary buttons, Run). */
:root {
  /* darker gunmetal silver with soft streaks, so white text stays readable on every part of it */
  --silver: linear-gradient(104deg,
    #464a57 0%, #50545f 12%, #5c606c 18%, #686c79 20.5%, #5a5e6a 23%, #4d515d 30%,
    #474b57 38%, #535763 44%, #626673 49%, #727684 51%, #626673 53%, #50545f 59%,
    #484c58 67%, #50545f 75%, #5e626e 81%, #6c707d 83%, #5a5e6a 86%, #4b4f5b 93%, #444855 100%);
  --silver-edge: inset 0 0 0 2px #15161c, inset 0 0 0 4px #b9bdc8, inset 0 0 0 5px #3b3e49,
                 inset 0 6px 0 0 rgba(255,255,255,.12), inset 0 -6px 0 0 rgba(10,11,16,.3);
  --silver-text: -1px 0 0 #15161c, 1px 0 0 #15161c, 0 -1px 0 #15161c, 0 1px 0 #15161c, 2px 2px 0 rgba(10,11,16,.6);
}
nav button.active, .seg button.on, .seg.modes button.on, .btn.primary, .card:not(.idle):not(.error) .btn.primary, .go:not(.cancel) {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--silver) !important; background-size: 220% 100% !important; background-position: 0% 0 !important;
  color: #ffffff !important; text-shadow: var(--silver-text) !important;
  box-shadow: var(--silver-edge) !important; filter: none;
}
nav button.active .n { background: rgba(42,45,56,.35); color: #fff; }
/* the shine: a bright pixel streak that sweeps across on hover (and now and then on the Run button) */
nav button.active::after, .seg button.on::after, .btn.primary::after, .go:not(.cancel)::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 28%; z-index: -1; pointer-events: none;
  background: linear-gradient(104deg, transparent 0, rgba(255,255,255,0) 20%, rgba(255,255,255,.22) 46%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.22) 54%, rgba(255,255,255,0) 80%, transparent 100%);
  transform: skewX(-18deg); opacity: 0; }
nav button.active:hover::after, .seg button.on:hover::after, .btn.primary:hover::after, .go:not(.cancel):hover::after { animation: silver-sweep .7s steps(10) 1; }
.go:not(.cancel)::after { animation: silver-sweep-pause 6s steps(60) 3.5s infinite; }
@keyframes silver-sweep { 0% { left: -40%; opacity: 1; } 100% { left: 115%; opacity: 1; } }
@keyframes silver-sweep-pause { 0% { left: -40%; opacity: 1; } 16% { left: 115%; opacity: 1; } 17%, 100% { left: 115%; opacity: 0; } }
nav button.active:hover, .seg button.on:hover, .btn.primary:hover, .go:not(.cancel):hover { background-position: 30% 0 !important; }
.btn.primary:active, .go:not(.cancel):active, .seg button.on:active {
  transform: translateY(1px); box-shadow: inset 0 0 0 2px #2a2d38, inset 0 0 0 4px #8d919d, inset 0 0 0 5px #2f323c, inset 0 6px 0 0 rgba(10,11,16,.35) !important; }
.go:not(.cancel) { font-size: 17px; }
.btn.primary:disabled { filter: grayscale(.3) brightness(.85); }
@media (prefers-reduced-motion: reduce) { nav button.active::after, .seg button.on::after, .btn.primary::after, .go::after { animation: none !important; } }

/* ================================================================ gunmetal info boxes
   Status cards (Ready, working, Done) and notices are dark gunmetal plates in the same pixel-metal
   style as the buttons, a few shades darker so the silver buttons on them still stand out. */
.card:not(.idle):not(.error), .card.notice {
  background: linear-gradient(104deg, #2b2d37 0%, #31343f 20%, #3a3d49 23%, #30333e 27%, #2c2e38 48%, #363945 52%, #2d2f39 56%, #2a2c36 80%, #343743 83%, #2b2d37 100%) !important;
  color: #f4f5f8 !important;
  box-shadow: inset 0 0 0 2px #121319, inset 0 0 0 4px #6e7280, inset 0 0 0 5px #1c1d24,
              inset 0 6px 0 0 rgba(255,255,255,.06), inset 0 -6px 0 0 rgba(0,0,0,.28) !important;
  border: 0 !important;
}
.card:not(.idle):not(.error) .t { color: #ffffff; text-shadow: 1px 1px 0 #0d0e13; }
.card:not(.idle):not(.error) .p, .card.notice .p { color: #c9ccd6 !important; }
.card.notice ul { color: #dcdee6 !important; }
.card:not(.idle):not(.error) .tool { color: #aeb2bf !important; }
/* plain buttons on the plate */
.card:not(.idle):not(.error) .btn:not(.primary) { background: #3c3f4b !important; color: #f4f5f8 !important; font-weight: 600;
  box-shadow: inset 0 0 0 2px #15161c, inset 0 2px 0 2px rgba(255,255,255,.08), inset 0 -3px 0 1px rgba(0,0,0,.35) !important; }
.card:not(.idle):not(.error) .btn:not(.primary):hover { background: #474a57 !important; }
/* progress bar: silver segments in a dark slot */
.card:not(.idle):not(.error) .bar { background: #15161c !important; box-shadow: inset 0 0 0 2px #0d0e13 !important; }
.card:not(.idle):not(.error) .bar i { background: repeating-linear-gradient(90deg, #b9bdc8 0 8px, transparent 8px 10px) !important; }

/* ================================================================ ROM Tools explorer */
.rx { position: relative; }
.rx > :not(.rx-ghost) { position: relative; }
/* Head: title, lead, search + description on the left; box art on the right. */
.rx-head { display: grid; grid-template-columns: minmax(200px, 32%) minmax(0, 1fr) 196px; grid-template-rows: auto auto; column-gap: 14px; align-items: start; }
.rx-title { grid-column: 1 / 3; } .rx-title .lead { margin: 8px 0 12px; }
.rx-head .rom-search { grid-column: 1; grid-row: 2; }
.rx-desc { grid-column: 2; grid-row: 2; }
.rx-art { grid-column: 3; grid-row: 1 / 3; width: 196px; height: 162px; margin-top: -6px; display: grid; place-items: center; }
.rx-art img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(4px 6px 0 rgba(0,0,0,.45)); }
.rx-noart { width: 132px; height: 150px; display: grid; place-items: center; font-size: 54px; font-weight: 800; line-height: 1; color: #6e5a8c;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 2px #3b2657; clip-path: var(--notch); }
.rx-noart:empty { opacity: .5; }
/* Description: semi-transparent so the faded box art shows through; long text scrolls by itself. */
.rx-desc { height: 92px; overflow: hidden; padding: 8px 14px; background: rgba(24, 14, 38, .62); box-shadow: inset 0 0 0 2px rgba(80, 56, 112, .7); clip-path: var(--notch); font-size: 13px; line-height: 1.45; }
.rx-desc.muted { color: var(--muted); } .rx-desc.nomatch { color: var(--orange); font-weight: 600; }
.rx-desc-in.scroll { animation: rx-scroll var(--dur, 10s) linear infinite alternate; }
.rx-desc:hover .rx-desc-in { animation-play-state: paused; }
@keyframes rx-scroll { 0%, 18% { transform: translateY(0); } 82%, 100% { transform: translateY(var(--dist, 0)); } }
@media (prefers-reduced-motion: reduce) { .rx-desc { overflow: auto; } .rx-desc-in.scroll { animation: none; } }
/* The selected game's box art, big and faded, behind the description, folder and details. */
.rx-ghost { position: absolute; z-index: 0; left: calc(32% + 14px); right: 0; top: 70px; bottom: 0; pointer-events: none;
  background: no-repeat center 30% / cover; opacity: .16; filter: saturate(.8);
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 70%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 70%, transparent 100%); }
.romx { display: grid; grid-template-columns: minmax(200px, 32%) minmax(0, 1fr); gap: 14px; margin-top: 12px; }
.rx-right { display: flex; flex-direction: column; gap: 6px; height: var(--rom-h, 300px); min-width: 0; }
.rx-right .path input { background: rgba(24, 14, 38, .62); }
/* Ship Mods: the same box art header as ROM Tools. */
.sx .rx-head { grid-template-columns: minmax(220px, 36%) minmax(0, 1fr) 196px; margin-bottom: 14px; }
.sx-id { grid-column: 1; grid-row: 2; min-width: 0; }
.sx-card { cursor: default; padding: 9px 12px; min-height: 46px; }
.sx-card:not(.on) { background: rgba(24, 14, 38, .62); box-shadow: inset 0 0 0 2px rgba(80, 56, 112, .7); }
.sx-card:not(.on) b { color: var(--muted); }
.sx-how { margin-top: 6px; padding: 0 12px; font-size: 11.5px; color: var(--muted); text-shadow: 1px 1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sx-ghost { left: 34%; top: 150px;
  /* fades in from the left (30%) as well as top and bottom */
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 30%), linear-gradient(180deg, transparent 0, #000 18%, #000 70%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 30%), linear-gradient(180deg, transparent 0, #000 18%, #000 70%, transparent 100%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
/* Works with: after the search the chips are toggles. Green on this PC, red not found, purple selected. */
.sx .games { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-w { display: inline-flex; }
.chip-w.sel { filter: drop-shadow(0 0 1px #e2c2ff) drop-shadow(0 0 7px rgba(176, 108, 255, .9)); }   /* the glow is around the chip, not the text */
button.chip { border: 0; font: inherit; font-size: 12px; cursor: pointer; }
.chip.have { background: #1d4f1f; color: #c4f7a6; box-shadow: inset 0 0 0 2px #46c43a; }
.chip.missing { background: #4a1621; color: #ffb0b8; box-shadow: inset 0 0 0 2px #d23c4c; cursor: help; }
.chip.sel { background: #5a2b96; color: #fff; box-shadow: inset 0 0 0 2px #c48cff; }
.chip .stale { color: var(--warn); font-weight: 700; margin-left: 6px; }
.chip.have:hover { background: #276a29; } .chip.sel:hover { background: #6a35ae; }
.chip:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }
.sx-find { margin-top: 8px; font-size: 12px; color: var(--muted); }
.linkish { all: unset; cursor: pointer; color: var(--orange-hi); text-decoration: underline; text-underline-offset: 2px; }
.linkish:hover { color: #fff; }
.sx .path input, .sx .text { background: rgba(24, 14, 38, .62); }
.sx .chip small { opacity: .7; font-size: 10.5px; }
.rx-count { font-size: 12.5px; color: var(--muted); padding: 6px 12px 4px; text-shadow: 1px 1px 0 #000; }   /* lines up with the text in the fields */
/* Browse… on ROM Tools glows white. The glow sits on a wrapper: the button's notched corners would clip it. */
.glow { display: flex; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px rgba(255,255,255,.6)); }
/* Scan progress: pixel blocks in the footer's colours. */
.rx-prog { margin: 0 12px 4px; height: 12px; flex: none; background: #1a0f29; box-shadow: inset 0 0 0 2px #3b2657; clip-path: var(--notch); --step: 2px; position: relative; }
.rx-prog, .rx-prog[hidden] { display: none; }   /* scan progress shows in the footer bar */
.rx-prog i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: calc((100% - 4px) * var(--p, 0)); transition: width .2s steps(4);
  background: linear-gradient(90deg, #d52c78, #a01c6c 45%, #670c5e 70%, #fcb494) 0 0 / calc(100% / max(var(--p, 0), .001)) 100%;
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px); mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px); }
.rx-prog i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.35) 0 2px, transparent 2px); }

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const join = (dir, name) => (dir ? dir.replace(/[\\/]+$/, '') + '\\' + name : '');
const baseName = (p) => (p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop();
let S = null, cfg = null, page = 'upscale', job = { running: false, task: '', log: [], result: null, error: null, done: 0, total: 0, message: '' };
let statusCache = {}, packAfter = null, fixParams = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

// ---------------------------------------------------------------- splash
// One phrase per launch, picked at random. "Keep it clean" in Settings leaves out the spicy ones.
const PHRASES = {
  'Absolutely disrespectful': [
    'Your Textures Look Like Ass. Fix Them.', '64 Bits. 4K Attitude. Zero Mercy.', 'Putting the ‘HD’ in ‘Holy Shit, That’s N64?’',
    'Those Textures Aged Like Milk.', 'Your Childhood Called. Its Graphics Are Embarrassing.', 'Blurry as Hell. Fixed as Fuck.',
    'Same Game. Less Fugly.', 'The N64 Deserves Better Than That Pixelated Bullshit.', 'Turning Texture Crimes into Pixel Crimes of Passion.',
    'Your ROM Has Seen Some Shit. We’re Here to Help.'],
  'N64 roast session': [
    'Expansion Pak for Your Eyeballs.', 'More Pixels Than Nintendo Ever Intended.', 'Making Muddy Textures Eat Their Vegetables.',
    'Your Favourite Childhood Game Has Had a Fucking Glow-Up.', 'Fourteen Polygons. One Hell of a Makeover.', 'Rendering Nostalgia. Destroying Blur.',
    'Because Even Mario Deserves Better Skin.', 'The Polygon Count Can Stay. The Ugly Can’t.', 'We Can’t Fix the Framerate. We Can Fix Those Textures.',
    'Nintendo 64 Graphics? More Like Nintendo 64K.'],
  'Unhinged gamer energy': [
    'ROMs Don’t Remaster Themselves, Bitch.', 'Dump ROMs. Upscale Textures. Commit Pixel Crimes.', 'Vibe Coded. Texture Pilled.',
    'No Talent. All Texture.', 'Built Different. Runs on Nostalgia.', 'Fuck the Blur. Respect the Cartridge.',
    'Your Emulator Called. It Wants Better Assets.', 'Making Pixels So Sharp They Need a Warning Label.', 'HD Texture Packs for Games That Refuse to Die.',
    'We Put the ‘Hell Yeah’ in High Resolution.'],
};
const SPICY = /\b(ass|shit|fuck\w*|bullshit|bitch|hell|fugly)\b/i;
function pickPhrase(clean) {
  const all = Object.entries(PHRASES).flatMap(([set, list]) => list.map((text) => ({ set, text })));
  const pool = clean ? all.filter((p) => !SPICY.test(p.text)) : all;
  return pool[Math.floor(Math.random() * pool.length)];
}
// Header subtitle catchphrase: steps through the whole list (shuffled once per launch), one per page switch.
let hdrList = [], hdrAt = 0;
function nextHeaderPhrase() {
  if (!hdrList.length) {
    const clean = cfg.cleanPhrases === true;
    hdrList = Object.values(PHRASES).flat().filter((t) => !clean || !SPICY.test(t));
    for (let i = hdrList.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [hdrList[i], hdrList[j]] = [hdrList[j], hdrList[i]]; }
    if (window.__hdrStart) hdrAt = hdrList.indexOf(window.__hdrStart);
  }
  const el = $('#sub');
  el.textContent = hdrList[hdrAt % hdrList.length]; hdrAt++;
  el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
}
// The splash is on screen from the first frame (it's in the page, not added later), so the app never
// flashes first. It runs 5 s; the app is shown at 4.5 s, under the fading splash. Enter, Space, Esc
// or a click on the logo skips it. Anything that pops up at start waits for it (whenSplashGone).
const SHOW_APP_AT = 4500;
const SKIP_KEYS = new Set(['Enter', ' ', 'Spacebar', 'Escape', 'Esc']);
let splashWaiters = [];
function showApp() { $('.app').classList.remove('waiting'); }
function hideSplash() {
  $('#splash').hidden = true; showApp();
  const w = splashWaiters; splashWaiters = null; if (w) w.forEach((fn) => setTimeout(fn, 120));
}
// Two halves for the two colours: at the sentence break, or where a one-sentence phrase pauses.
const PHRASE_BREAKS = ["in 'Holy", 'Aged Like', 'Than That', 'into Pixel', 'for Your Eyeballs', 'Than Nintendo', 'Eat Their', 'Has Had',
  'Deserves Better Skin', 'Bitch.', 'They Need', 'for Games', 'in High'];
function splitPhrase(t) {
  const m = t.match(/^(.+?[.?!])\s+(\S.*)$/);
  if (m) return [m[1], m[2]];
  const at = PHRASE_BREAKS.map((k) => t.indexOf(' ' + k)).find((i) => i > 0);
  if (at > 0) return [t.slice(0, at), t.slice(at + 1)];
  const words = t.split(' '); if (words.length < 2) return [t, ''];       // anything new: split near the middle
  let best = 1, half = t.length / 2;
  for (let i = 1; i < words.length; i++) if (Math.abs(words.slice(0, i).join(' ').length - half) < Math.abs(words.slice(0, best).join(' ').length - half)) best = i;
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}
// The catchphrase is one line at the standard size, 32.8 px (2 screen pixels per Pixelfy pixel, which
// is 0.061 em): smaller crisp steps (24.6, 16.4 px) only if a phrase can't fit on one line otherwise.
async function fitPhrase() {
  const el = $('#phrase'); if (!el) return;
  try { await Promise.race([document.fonts.load('49px Pixelfy', el.textContent), new Promise((r) => setTimeout(r, 800))]); } catch { /* fall back */ }
  const room = el.clientWidth - 40, text = el.textContent.toUpperCase();
  const g = document.createElement('canvas').getContext('2d');
  for (const px of [32.8, 24.6, 16.4]) {
    g.font = `${px}px Pixelfy`;
    if (g.measureText(text).width <= room || px === 16.4) { el.style.setProperty('--phrase-size', px + 'px'); return; }
  }
}
function whenSplashGone(fn) { if (splashWaiters) splashWaiters.push(fn); else setTimeout(fn, 0); }
function showSplash() {
  const sp = $('#splash');
  if (cfg.splash === false) { hideSplash(); return; }
  const p = window.__phrase || pickPhrase(cfg.cleanPhrases === true);
  const text = p.text.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');   // Pixelfy has straight quotes only
  const [a, b] = splitPhrase(text);
  $('#phrase').innerHTML = `<span class="p1">${esc(a)}</span>${b ? ` <span class="p2">${esc(b)}</span>` : ''}`; $('#phrase').dataset.text = text;
  fitPhrase();
  $('#phrase-sub').textContent = `R64texHD v${S.version}`;
  const started = performance.now();                 // the animation started with the page
  setTimeout(showApp, Math.max(0, SHOW_APP_AT - started));
  sp.addEventListener('animationend', (e) => { if (e.target === sp) hideSplash(); });
  $('img', sp).addEventListener('click', hideSplash);
}

// ---------------------------------------------------------------- controls
const seg = (key, options, value, disabled = [], cls = '') => `<div class="seg ${cls}" data-key="${key}">` + options.map(([v, label]) =>
  `<button data-v="${esc(v)}" class="${String(value) === String(v) ? 'on' : ''}" ${disabled.includes(v) ? 'disabled' : ''}>${label}</button>`).join('') + '</div>';
const row = (title, desc, control, show = true) => `<div class="row" ${show ? '' : 'hidden'}><div class="l"><b>${title}</b><small>${desc}</small></div><div>${control}</div></div>`;

// ---------------------------------------------------------------- first launch: Sacred Geometry? (new installs only)
// Yes: the box breaks into rainbow pixels (~2 s) and Psychedelic goes on. No: the text dissolves, "Maybe next
// time....." steps in, and the box goes after 2 s; Psychedelic stays off.
let geoAfterTools = false;
const GEO_BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const geoRnd = (i) => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };
const geoHue = (h, l = 60) => `hsl(${((h % 360) + 360) % 360} 90% ${l}%)`;
function geoMask(w, h, cell, p, seed) {
  w = Math.max(cell, w); h = Math.max(cell, h);
  const c = document.createElement('canvas'); c.width = Math.ceil(w / cell); c.height = Math.ceil(h / cell);
  const g = c.getContext('2d'), img = g.createImageData(c.width, c.height);
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const k = (GEO_BAYER[(y & 3) * 4 + (x & 3)] / 16) * 0.6 + geoRnd(x * 31 + y * 17 + seed) * 0.4;
    img.data[(y * c.width + x) * 4 + 3] = k >= p ? 255 : 0;
  }
  g.putImageData(img, 0, 0);
  return { url: c.toDataURL(), cw: c.width, ch: c.height };
}
function geoSetMask(el, m, cell) { el.style.webkitMaskImage = `url(${m.url})`; el.style.webkitMaskSize = `${m.cw * cell}px ${m.ch * cell}px`; el.style.webkitMaskRepeat = 'no-repeat'; }
function geoFol(cv, t) {
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, cv.width, cv.height);
  const cx = cv.width / 2, cy = cv.height / 2, r = 9, a0 = t * 0.35, pts = [[0, 0]];
  for (let k = 0; k < 6; k++) pts.push([Math.cos(a0 + k * Math.PI / 3) * r, Math.sin(a0 + k * Math.PI / 3) * r]);
  for (let k = 0; k < 6; k++) pts.push([Math.cos(a0 + k * Math.PI / 3 + Math.PI / 6) * r * 1.732, Math.sin(a0 + k * Math.PI / 3 + Math.PI / 6) * r * 1.732]);
  g.lineWidth = 1;
  pts.forEach(([x, y], i) => { g.strokeStyle = geoHue(t * 60 + i * 25, 55); g.globalAlpha = 0.28; g.beginPath(); g.arc(Math.round(cx + x) + 0.5, Math.round(cy + y) + 0.5, r, 0, Math.PI * 2); g.stroke(); });
  g.globalAlpha = 0.35; g.strokeStyle = geoHue(t * 60 + 180, 60); g.beginPath(); g.arc(cx + 0.5, cy + 0.5, r * 2.9, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
}
function askGeo() {
  if (!$('#modal').hidden) { setTimeout(askGeo, 400); return; }
  modal(`<div class="geo-ask"><canvas class="fol" width="130" height="60"></canvas>
    <h3>Battle the secrets of Sacred Geometry?</h3>
    <p>Reality is just a suggestion, mortal — now behold the machine elves!</p>
    <div class="buttons"><button class="btn" id="geo-no">No</button><button class="btn primary" id="geo-yes">Yes</button></div>
    <div class="later">Maybe next time…..</div></div>`);
  const d = $('#dialog'); d.classList.add('trippy');
  const pc = document.createElement('canvas'); pc.id = 'geo-parts'; pc.width = Math.ceil(innerWidth / 4); pc.height = Math.ceil(innerHeight / 4); document.body.appendChild(pc);
  const t0 = performance.now(); let mode = '', tPress = 0, parts = null, raf = 0;
  const finish = (on) => {
    cancelAnimationFrame(raf); pc.remove(); d.classList.remove('trippy'); d.style.webkitMaskImage = '';
    cfg.psychedelic = on; save(true); closeModal(); render();
  };
  const frame = () => {
    const t = (performance.now() - t0) / 1000, box = d.querySelector('.geo-ask'); if (!box) { pc.remove(); return; }
    d.style.setProperty('--rb', geoHue(t * 120, 62)); geoFol(box.querySelector('.fol'), t);
    const pg = pc.getContext('2d'); pg.clearRect(0, 0, pc.width, pc.height);
    const s = mode ? (performance.now() - tPress) / 1000 : 0;
    if (mode === 'yes') {                                                   // breaks into rainbow pixels
      const p = Math.min(1, s / 2), r = d.getBoundingClientRect(), cell = 8;
      const m = geoMask(r.width, r.height, cell, p, 7); geoSetMask(d, m, cell);

      const p = Math.min(1, s / 0.6);

function suggest() {

  // The game archive carries over whether or not there's an output folder.
  if (!o.base && o.archive) o.base = o.archive;
  if (!g.base && o.archive) g.base = o.archive;
  const out = cfg.outputFolder;
  if (!out) return;
  const firstIn = Array.isArray(u.inputs) ? u.inputs[0] : u.inputs;
  if (!u.output && firstIn) u.output = join(out, baseName(u.inputs.length > 1 ? firstIn.replace(/[\\/][^\\/]*$/, '') : firstIn).replace(/\.(png|dds)$/i, '') + '-upscaled');
  if (!c.output) c.output = join(out, (baseName(c.input || cfg.dumpFolder) || 'rt64-dump') + '-textures');
  if (!p.output && p.input) p.output = join(out, baseName(p.input) + '.rtz');
  if (!cfg.unpack.output && cfg.unpack.input) cfg.unpack.output = join(out, baseName(cfg.unpack.input).replace(/\.rtz$/i, '') + '-unpacked');
  if (!o.output && o.archive) o.output = join(out, baseName(o.archive).replace(/\.(o2r|otr)$/i, '') + '-textures');

async function refreshStatus() {
  if (!$('#status')) return;
  if (job.task === taskOf(page) && (job.running || job.result || job.error)) return renderJob();
  const [kind, value] = inputFor();
  if (!value || (Array.isArray(value) && !value.length)) return setCard('idle', IDLE_TEXT[taskOf(page)], 'Use Browse… or paste a path.');
  const sn = page === 'ports' && shipNotice();
  if (sn) return setCard('notice', sn.title, sn.text, undefined, CHECK_AGAIN);
  const key = kind + '|' + JSON.stringify(value);
  if (!statusCache[key]) {
    setCard('idle', 'Checking…', '');
    if (window.Wizard) Wizard.busy(true);
    let r; try { r = await window.htk.inspect(kind, value); } finally { if (window.Wizard) Wizard.busy(false); }
    if (r.state === 'ready') statusCache[key] = r;            // problems are never remembered: they're checked again every time
    else { if (inputFor()[0] === kind) setCard(r.state, r.title, r.text, undefined, CHECK_AGAIN); return; }
  }
  if (inputFor()[0] !== kind) return;
  const s = statusCache[key];

    const size = r.sizeMB === undefined ? '' : r.sizeMB >= 1 ? `, ${r.sizeMB.toFixed(1)} MB` : `, ${Math.max(1, Math.round(r.sizeMB * 1024))} KB`;
    const what = count + size;

    if (r.packable && job.task === 'convert') actions += `<button class="btn primary" id="pack-now">Pack into .rtz…</button>`;

  if (id === 'sounds-rescan') { await Music.reload(); await Wizard.reloadSounds(); render(); toast('Sounds rescanned'); return; }
  if (id === 'scenes-get') { e.target.disabled = true; $('#scene-lib').textContent = 'Downloading fights and trips…'; window.htk.scenesDownload(); return; }
  if (id === 'reset-wins') { cfg.wizardWins = 0; cfg.wizardBonusAt = 0; save(true); render(); return; }
  if (id === 'tools-yes') { installAll(); return; }
  if (id === 'ship-find') { findPorts(); return; }

// A new input suggests a matching output name.
function onPath(key) {
  if (key === 'roms.folder') { ROMS.list = []; ROMS.selected = ''; ROMS.info = null; setTimeout(() => maybeScanRoms(true), 0); }
  statusCache = {}; PV.listKey = '';                // the same folder may have new files now
  const out = cfg.outputFolder;
  if (out) {
    if (key === 'upscale.inputs') {
      const first = cfg.upscale.inputs[0] || '';
      const name = cfg.upscale.inputs.length > 1 ? baseName(first.replace(/[\\/][^\\/]*$/, '')) : baseName(first).replace(/\.(png|dds)$/i, '');
      cfg.upscale.output = join(out, name + '-upscaled');
    }
    if (key === 'convert.input') cfg.convert.output = join(out, baseName(cfg.convert.input) + '-textures');
    if (key === 'pack.input') cfg.pack.output = join(out, baseName(cfg.pack.input) + '.rtz');
    if (key === 'unpack.input') cfg.unpack.output = join(out, baseName(cfg.unpack.input).replace(/\.rtz$/i, '') + '-unpacked');
    if (key === 'ports.archive') cfg.ports.output = join(out, baseName(cfg.ports.archive).replace(/\.(o2r|otr)$/i, '') + '-textures');
    if (key === 'ports.hdInput') cfg.ports.modOutput = join(out, baseName(cfg.ports.hdInput) + '.o2r');
    if (key === 'legacy.input') cfg.legacy.output = join(out, baseName(cfg.legacy.input).replace(/\.(hts|htc)$/i, '') + '-rt64');
    if (key === 'legacy.riceInput') cfg.legacy.modOutput = join(out, baseName(cfg.legacy.riceInput).replace(/\.(hts|htc)$/i, '') + '.o2r');
    if (key === 'legacy.htsName' && cfg.legacy.htsName) cfg.legacy.htsOutput = join(out, cfg.legacy.htsName.trim() + '_HIRESTEXTURES.hts');
  }
  const fixExt = (k, ext) => { const v = getVal(k); if (v && !new RegExp(`\\${ext}$`, 'i').test(v)) setVal(k, v + ext); };
  if (key === 'pack.output') fixExt(key, '.rtz');
  if (key === 'ports.modOutput' || key === 'legacy.modOutput') fixExt(key, '.o2r');
  if (key === 'legacy.htsOutput') fixExt(key, '.hts');
  clearFinished();
}

function clearFinished() { if (!job.running) { job.result = null; job.error = null; job.task = ''; } }

document.addEventListener('change', (e) => {

async function save(quiet) { await window.htk.saveSettings(cfg); if (!quiet) toast('Settings saved'); }

function params(task) {
  switch (task) {
    case 'upscale': return { ...cfg.upscale, aiOk: aiOk() };
    case 'convert': return { ...cfg.convert, input: cfg.convert.input || cfg.dumpFolder };
    case 'unpack': return { ...cfg.unpack };

    case 'fix': return { ...fixParams };
    case 'o2rExtract': return { archive: cfg.ports.archive, output: cfg.ports.output };
    case 'o2rBuild': return { input: cfg.ports.hdInput, base: cfg.ports.base, output: cfg.ports.modOutput, alt: cfg.ports.alt, compression: cfg.ports.compression };
    case 'legacyImport': return { input: cfg.legacy.input, dumpDb: cfg.legacy.dumpDb || cfg.convert.output, output: cfg.legacy.output };
    case 'legacyHts': return { input: cfg.legacy.htsInput, name: cfg.legacy.htsName, output: cfg.legacy.htsOutput || (cfg.legacy.htsName && cfg.outputFolder ? join(cfg.outputFolder, cfg.legacy.htsName.trim() + '_HIRESTEXTURES.hts') : '') };
    case 'roms': return { folder: cfg.roms.folder };
    case 'riceToO2r': return { input: cfg.legacy.riceInput, base: cfg.legacy.base, output: cfg.legacy.modOutput, alt: cfg.ports.alt };

let AI_ASKED = false;
async function start(task) {
  const um = cfg.upscale.method;
  if (task === 'upscale' && (um === 'smart' || um === 'ai') && !S.tools.realesrgan && aiOk() && !AI_ASKED) {
    modal(`<div class="ask-tools"><h3>${um === 'smart' ? 'Smart' : 'AI'} works best with Real-ESRGAN</h3><p>It’s the AI upscaler for big, detailed textures (45 MB). Without it, those textures use HD 4×.</p>
      <div class="buttons"><button class="btn" id="ai-skip">Not now</button><button class="btn primary" id="ai-get">Download</button></div></div>`);
    return;
  }
  await save(true);

  const r = await window.htk.run(task, params(task));

window.htk.onStarted(() => {});

  else {

    if (d.task === 'roms') {

      if (!ROMS.list.some((x) => x.path === ROMS.selected)) { ROMS.selected = ''; ROMS.info = null; }
    }
    if (r.written !== undefined) job.log.push(`${r.title} ${r.written} texture(s)${r.failed ? `, ${r.failed} failed` : ''} in ${r.seconds.toFixed(1)} s → ${r.output}`);
  }
  statusCache = {};
  if (job.task !== taskOf(page)) {
    const tp = TASK_PAGE[job.task];

  }

  if (d.task === 'convert' && d.result && d.result.packable) askPack(d.result);

  if (d.task === 'upscale' && d.result && d.result.packable) askNext(d.result);

// ---------------------------------------------------------------- Ship Mods (4): the game behind the archive
// The file to look at: the game archive for Extract Textures; for Create HD Texture Pack, the base archive, or the
// HD folder (its texture list remembers the game). shipid.js reads the archive's version file (the ROM's CRC1).
const SHIP = { target: '', id: null, check: null, busy: false, finding: false, shown: false, checking: 0 };
const shipTarget = () => (cfg.ports.mode === 'extract' ? cfg.ports.archive : cfg.ports.base || cfg.ports.hdInput) || '';
const SHIP_NOTE = { 'not-generated': 'Game archive not made yet', outdated: 'Game archive is outdated', unreadable: 'Game archive can’t be read' };
const SHIP_STALE = { 'not-generated': 'run once', outdated: 'outdated', unreadable: 'damaged' };
// The status card's warning when the chosen archive is missing or older than the installed port.
function shipNotice() {
  const c = SHIP.check;
  if (!c || !SHIP_NOTE[c.state] || c.file !== shipTarget()) return null;
  return { title: SHIP_NOTE[c.state], text: `${c.message}\n${c.file}` };
}
// Every port toggle, Check again, Search again, coming back to the app and opening the page: look
// at each found port and the chosen archive again — is the game archive made, and is it from the
// port build that's installed now? (core/shipcheck.js)
async function shipRecheck() {
  const n = ++SHIP.checking, t = shipTarget();
  if (t !== SHIP.target) { SHIP.target = t; SHIP.id = null; SHIP.check = null; }
  SHIP.busy = !!t && !SHIP.id;
  const jobCard = job.task === taskOf(page) && (job.running || job.result || job.error);
  if (page === 'ports') { drawShip(); if (!jobCard && !job.running) setCard('idle', 'Checking…', ''); }
  if (window.Wizard) Wizard.busy(true);
  let r; try { r = await window.htk.shipCheck(cfg.shipFound ? cfg.shipFound.ports : null, t); } finally { if (window.Wizard) Wizard.busy(false); }
  if (n !== SHIP.checking) return false;                         // a newer check took over
  if (r && !r.error) {
    if (r.ports && cfg.shipFound) { cfg.shipFound.ports = r.ports; cfg.shipFound.checked = Date.now(); save(true); }
    if (shipTarget() === t) { SHIP.check = r.target; SHIP.id = r.target ? r.target.id : null; }
  } else if (r && r.error) toast('Couldn’t check the ports: ' + r.error);
  SHIP.busy = false;
  if (page === 'ports') { statusCache = {}; drawShip(); if (!job.running) refreshStatus(); }
  return true;
}
// Before the search: plain chips. After it: toggles — green on this PC, red not found, purple (glowing)
// selected; a yellow note when the port's game archive isn't made yet or is older than the port.
function shipChips() {
  const on = SHIP.id && SHIP.id.port ? SHIP.id.port.name : '';
  const found = cfg.shipFound && cfg.shipFound.ports;
  if (!found) return (S.shipPorts || []).map((p) => `<span class="chip ${p.name === on ? 'on' : ''}">${esc(p.name)}</span>`).join('') + '<span class="chip">Other .o2r ports</span>';
  return (S.shipPorts || []).map((p) => {
    const f = found.find((x) => x.name === p.name) || { installed: false };
    const sel = p.name === on, state = sel ? 'sel' : f.installed ? 'have' : 'missing';
    const stale = f.installed && SHIP_STALE[f.state];
    const build = f.build ? ` · build ${f.build.text}` : '';
    const tip = f.installed ? `${p.name} is on this PC: ${f.dir}${build}\n${f.message || ''}` : `${p.name} wasn’t found on this PC`;
    return `<span class="chip-w ${state}"><button class="chip ship-port ${state}" data-port="${esc(p.name)}" data-state="${esc(f.state || '')}" title="${esc(tip)}" aria-pressed="${sel}">${esc(p.name)}${stale ? `<span class="stale">${stale}</span>` : ''}</button></span>`;
  }).join('');
}
function drawShipFind() {
  const el = $('#sx-find'); if (!el) return;
  const r = cfg.shipFound;
  if (SHIP.finding) { el.innerHTML = '<span class="pv-busy" style="position:static"><i></i>Looking for installed ports…</span>'; return; }
  if (!r) { el.innerHTML = '<button class="linkish" id="ship-find">Find installed ports</button>'; return; }
  const n = r.ports.filter((p) => p.installed).length;
  el.innerHTML = `${n ? `Found ${n} of ${r.ports.length} ports on this PC` : 'No ports found on this PC'} in ${(r.ms / 1000).toFixed(1)} s${r.complete ? '' : ' (stopped at the time limit)'} · <button class="linkish" id="ship-find">Search again</button>`;
}
// Folders listed only, never Windows Search; folders you already used are looked at first.
async function findPorts() {
  if (SHIP.finding) return;
  SHIP.finding = true; drawShipFind();
  const before = cfg.shipFound ? cfg.shipFound.ports.filter((p) => p.installed).map((p) => p.dir) : [];
  const seeds = [cfg.ports.archive, cfg.ports.base, cfg.ports.modOutput, cfg.legacy.base, cfg.legacy.modOutput, ...before];
  if (window.Wizard) Wizard.busy(true);
  let r; try { r = await window.htk.shipFind(seeds); } finally { if (window.Wizard) Wizard.busy(false); }
  SHIP.finding = false;
  if (r && !r.error) { cfg.shipFound = { at: Date.now(), ports: r.ports, ms: r.ms, folders: r.folders, complete: r.complete }; save(true); }
  else toast('Couldn’t look for ports: ' + ((r && r.error) || 'unknown error'));
  if (page === 'ports') await shipRecheck();
}
// Clicking a port: check it again first (it may have been run or updated since), then use its game
// archive and save into its mods folder.
async function selectPort(name) {
  await shipRecheck();
  const f = cfg.shipFound && cfg.shipFound.ports.find((p) => p.name === name);
  if (!f || !f.installed) { toast(`${name} wasn’t found on this PC. Search again, or use Browse… to pick its .o2r.`); return; }
  if (!f.archive) { toast(f.message || `${name} is installed but hasn’t made its game archive yet. Run it once with your ROM.`); return; }
  cfg.ports.archive = f.archive; cfg.ports.base = f.archive;
  const packName = (cfg.ports.modOutput && baseName(cfg.ports.modOutput)) || ((cfg.ports.hdInput && baseName(cfg.ports.hdInput)) || 'HD textures') + '.o2r';
  cfg.ports.modOutput = join(f.mods, packName);
  if (f.state === 'outdated' || f.state === 'unreadable') toast(SHIP_NOTE[f.state] + ': ' + f.message);
  onPath('ports.archive'); render();
}
function afterRenderShip() {
  if (!cfg.shipFound && !SHIP.finding) findPorts();               // the first visit looks for installed ports
  const first = !SHIP.shown; SHIP.shown = true;
  if (first || shipTarget() !== SHIP.target) shipRecheck();
  else drawShip();
}
function drawShip() {
  const card = $('#sx-id'), artEl = $('#rx-art'), ghost = $('#rx-ghost'), desc = $('#rx-desc'); if (!card) return;
  const chips = $('#ship-chips'); if (chips) chips.innerHTML = shipChips();
  drawShipFind();
  const id = SHIP.id, g = id && !id.error ? id.game : null, port = id && id.port;
  let text, cls = '', title, sub;
  if (!SHIP.target) { title = 'No archive yet'; sub = 'Choose a port’s .o2r below'; text = 'Pick a game archive (like sm64.o2r) and the game it comes from shows up here, box art and all.'; cls = 'muted'; }
  else if (SHIP.busy || !id) { title = 'Reading…'; sub = baseName(SHIP.target); text = 'Reading the archive…'; cls = 'muted'; }
  else if (g) { title = g.title; sub = [port && port.name, baseName(SHIP.target)].filter(Boolean).join(' · '); text = g.description || 'No description for this game yet.'; }
  else { title = 'Unknown game'; sub = baseName(SHIP.target); text = 'No ROM match found, what is this game?'; cls = 'nomatch'; }
  const c = SHIP.check && SHIP.check.file === SHIP.target ? SHIP.check : null;
  const made = c && c.state === 'ready' && c.version ? ` · Made by ${port ? port.name + ' ' : ''}${c.version.text}${c.build ? (c.version.major === c.build.major ? ', matches the installed build' : '') : ''}` : '';
  const stale = c && SHIP_NOTE[c.state] ? ` · ${SHIP_NOTE[c.state]}` : '';
  const how = id && !id.error && (g || port) ? `Found from ${id.source || 'the file name'}${id.crc ? ` · CRC1 ${id.crc}` : ''}${id.rom ? ` · ROM: ${id.rom}` : ''}${made}${stale}` : '';
  card.innerHTML = `<div class="rom-item sx-card ${g ? 'on' : ''}">${g ? rowArt(g.art) : ''}<b>${esc(title)}</b><span>${esc(sub)}</span></div>${how ? `<div class="sx-how" title="${esc(how)}">${esc(how)}</div>` : ''}`;
  const key = g ? g.art : (SHIP.target && id ? '?' : '');
  if (artEl.dataset.key !== key) {
    artEl.dataset.key = key;
    artEl.innerHTML = g ? `<img src="${artUrl(g.art)}" alt="${esc(g.title)} box art">` : `<div class="rx-noart">${key === '?' ? '?' : ''}</div>`;
    ghost.style.backgroundImage = g ? `url("${artUrl(g.art)}")` : 'none';
  }
  const inner = $('.rx-desc-in', desc);
  if (inner.textContent !== text) { inner.textContent = text; desc.className = 'rx-desc ' + cls; setupDescScroll(); }
}

// ---------------------------------------------------------------- ROM Tools (6)
const ROMS = { list: [], folder: '', selected: '', info: null, loading: '', filter: '', matched: 0, libraryCount: 0, error: '', asked: false };
const REGION_SHORT = { E: 'USA', J: 'JPN', P: 'EUR', D: 'GER', F: 'FRA', I: 'ITA', S: 'SPA', U: 'AUS', A: 'ALL', B: 'BRA', C: 'CHN', K: 'KOR', N: 'CAN', H: 'NED', W: 'SCN', X: 'EUR', Y: 'EUR', Z: 'EUR', G: 'GW', L: 'GW' };
function maybeScanRoms(force) {
  if (page !== 'roms' || job.running || !cfg.roms.folder) return;
  if (force || (!ROMS.list.length && ROMS.folder !== cfg.roms.folder)) start('roms');
}
function afterRenderRoms() { fitRomPanes(); fillRomList(); drawRomDetail(); drawRomCount(); }
// Opening ROM Tools with no folder set asks for one straight away (once per visit).
function askRomFolder() {

function drawRomCount(progress) {
  const el = $('#rx-count'), bar = $('#rx-prog'); if (!el) return;

const artUrl = (art) => '../assets/n64/boxart/' + encodeURIComponent(art);
// Box art (top right), the faded copy behind the details, and the scrolling description.
function drawRomArt() {

  const i = ROMS.info, lib = i && !i.error ? i.library : null;

  else if (!i) { text = 'Reading ROM…'; cls = 'muted'; }

  else text = lib.description || 'No description for this game yet.';
